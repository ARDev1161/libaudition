name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Check Ninja
        run: ninja --version
      - name: Configure
        run: cmake --preset ci
      - name: Build
        run: cmake --build --preset ci --parallel
      - name: Test
        run: ctest --preset ci

  minimal-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Ninja
        run: ninja --version
      - name: Configure without optional dependencies
        run: cmake --preset minimal
      - name: Build
        run: cmake --build --preset minimal --parallel


  installed-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure dependency-free install
        run: >-
          cmake -S . -B build-install -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DLIBAUDITION_WITH_SPDLOG=OFF
          -DLIBAUDITION_BUILD_TESTS=OFF
          -DLIBAUDITION_BUILD_EXAMPLES=OFF
          -DLIBAUDITION_FETCH_DEPENDENCIES=OFF
          -DLIBAUDITION_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build-install --parallel
      - name: Install
        run: cmake --install build-install --prefix "$PWD/install-default"
      - name: Verify installed default package from C++17 consumer
        shell: bash
        run: |
          mkdir -p /tmp/libaudition-default-consumer
          cat > /tmp/libaudition-default-consumer/CMakeLists.txt <<'CMAKE'
          cmake_minimum_required(VERSION 3.20)
          project(libaudition_default_consumer LANGUAGES CXX)
          find_package(libaudition 0.5.0 EXACT CONFIG REQUIRED)
          add_executable(consumer main.cpp)
          target_link_libraries(consumer PRIVATE
            audition::core
            audition::interfaces
            audition::dsp
            audition::spatial
            audition::memory
            audition::pipeline)
          target_compile_features(consumer PRIVATE cxx_std_17)
          CMAKE
          cat > /tmp/libaudition-default-consumer/main.cpp <<'CPP'
          #include <audition/audition.hpp>

          int main() {
              if (audition::kVersion != "0.5.0") {
                  return 1;
              }

              audition::TemporalSpatialTrackSmoother smoother{};
              audition::AcousticEventAssembler events{};
              audition::InMemoryAcousticSourceRegistry registry{};

              return smoother.trackedCount() == 0U &&
                             events.activeCount() == 0U &&
                             registry.list().empty()
                         ? 0
                         : 2;
          }
          CPP
          cmake -S /tmp/libaudition-default-consumer \
            -B /tmp/libaudition-default-consumer/build -G Ninja \
            -DCMAKE_PREFIX_PATH="$PWD/install-default"
          cmake --build /tmp/libaudition-default-consumer/build --parallel
          LD_LIBRARY_PATH="$PWD/install-default/lib:${LD_LIBRARY_PATH:-}" \
            /tmp/libaudition-default-consumer/build/consumer

  sanitizers:
    runs-on: ubuntu-latest
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
      - name: Configure ASan + UBSan
        run: >-
          cmake -S . -B build-sanitizers -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_SHARED_LIBS=OFF
          -DLIBAUDITION_WITH_SPDLOG=OFF
          -DLIBAUDITION_BUILD_TESTS=ON
          -DLIBAUDITION_BUILD_EXAMPLES=ON
          -DLIBAUDITION_WARNINGS_AS_ERRORS=ON
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build-sanitizers --parallel
      - name: Test under sanitizers
        run: ctest --test-dir build-sanitizers --output-on-failure

  qt-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt 5 Widgets
        run: |
          sudo apt-get update
          sudo apt-get install -y qtbase5-dev
      - name: Configure Qt playground
        run: >-
          cmake -S . -B build-qt-demo -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DLIBAUDITION_WITH_SPDLOG=OFF
          -DLIBAUDITION_BUILD_TESTS=OFF
          -DLIBAUDITION_BUILD_EXAMPLES=OFF
          -DLIBAUDITION_BUILD_QT_DEMO=ON
          -DLIBAUDITION_WARNINGS_AS_ERRORS=ON
      - name: Build Qt playground
        run: cmake --build build-qt-demo --parallel
      - name: Headless Qt playground self-test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./build-qt-demo/demo/qt/libaudition_qt_demo --self-test

  odas-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ODAS build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libfftw3-dev libasound2-dev libconfig-dev libpulse-dev qtbase5-dev
      - name: Configure with direct ODAS backend
        run: >-
          cmake -S . -B build-odas -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DLIBAUDITION_WITH_ODAS=ON
          -DLIBAUDITION_WITH_SPDLOG=OFF
          -DLIBAUDITION_BUILD_TESTS=ON
          -DLIBAUDITION_BUILD_EXAMPLES=ON
          -DLIBAUDITION_BUILD_QT_DEMO=ON
          -DLIBAUDITION_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build-odas --parallel
      - name: Headless Qt workbench self-test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./build-odas/demo/qt/libaudition_qt_demo --self-test
      - name: Test
        run: ctest --test-dir build-odas --output-on-failure
      - name: Install
        run: cmake --install build-odas --prefix "$PWD/install-odas"
      - name: Verify installed ODAS backend package
        shell: bash
        run: |
          mkdir -p /tmp/libaudition-odas-consumer
          cat > /tmp/libaudition-odas-consumer/CMakeLists.txt <<'CMAKE'
          cmake_minimum_required(VERSION 3.20)
          project(libaudition_odas_consumer LANGUAGES CXX)
          find_package(libaudition CONFIG REQUIRED)
          add_executable(consumer main.cpp)
          target_link_libraries(consumer PRIVATE audition::backend_odas)
          target_compile_features(consumer PRIVATE cxx_std_17)
          CMAKE
          cat > /tmp/libaudition-odas-consumer/main.cpp <<'CPP'
          #include <audition/backends/odas.hpp>
          int main() {
              audition::OdasOptions options{};
              return options.sample_rate_hz == 16000U ? 0 : 1;
          }
          CPP
          cmake -S /tmp/libaudition-odas-consumer -B /tmp/libaudition-odas-consumer/build -G Ninja             -DCMAKE_PREFIX_PATH="$PWD/install-odas"
          cmake --build /tmp/libaudition-odas-consumer/build --parallel


  samplerate-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt 5 Widgets
        run: |
          sudo apt-get update
          sudo apt-get install -y qtbase5-dev
      - name: Configure libsamplerate backend
        run: >-
          cmake -S . -B build-samplerate -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DLIBAUDITION_WITH_LIBSAMPLERATE=ON
          -DLIBAUDITION_WITH_SPDLOG=OFF
          -DLIBAUDITION_BUILD_TESTS=ON
          -DLIBAUDITION_BUILD_EXAMPLES=ON
          -DLIBAUDITION_BUILD_QT_DEMO=ON
          -DLIBAUDITION_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build-samplerate --parallel
      - name: Headless Qt workbench self-test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./build-samplerate/demo/qt/libaudition_qt_demo --self-test
      - name: Test
        run: ctest --test-dir build-samplerate --output-on-failure
      - name: Install
        run: cmake --install build-samplerate --prefix "$PWD/install-samplerate"
      - name: Verify installed libsamplerate backend package
        shell: bash
        run: |
          mkdir -p /tmp/libaudition-samplerate-consumer
          cat > /tmp/libaudition-samplerate-consumer/CMakeLists.txt <<'CMAKE'
          cmake_minimum_required(VERSION 3.20)
          project(libaudition_samplerate_consumer LANGUAGES CXX)
          find_package(libaudition CONFIG REQUIRED)
          add_executable(consumer main.cpp)
          target_link_libraries(consumer PRIVATE audition::backend_samplerate)
          target_compile_features(consumer PRIVATE cxx_std_17)
          CMAKE
          cat > /tmp/libaudition-samplerate-consumer/main.cpp <<'CPP'
          #include <audition/backends/samplerate.hpp>
          int main() {
              audition::SamplerateResampler backend{};
              return backend.backendInfo().name == "libsamplerate" ? 0 : 1;
          }
          CPP
          cmake -S /tmp/libaudition-samplerate-consumer             -B /tmp/libaudition-samplerate-consumer/build -G Ninja             -DCMAKE_PREFIX_PATH="$PWD/install-samplerate"
          cmake --build /tmp/libaudition-samplerate-consumer/build --parallel

  aec3-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt 5 Widgets
        run: |
          sudo apt-get update
          sudo apt-get install -y qtbase5-dev
      - name: Configure WebRTC AEC3 backend
        run: >-
          cmake -S . -B build-aec3 -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DLIBAUDITION_WITH_WEBRTC_AEC3=ON
          -DLIBAUDITION_WITH_SPDLOG=OFF
          -DLIBAUDITION_BUILD_TESTS=ON
          -DLIBAUDITION_BUILD_EXAMPLES=ON
          -DLIBAUDITION_BUILD_QT_DEMO=ON
          -DLIBAUDITION_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build-aec3 --parallel
      - name: Headless Qt workbench self-test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./build-aec3/demo/qt/libaudition_qt_demo --self-test
      - name: Test
        run: ctest --test-dir build-aec3 --output-on-failure
      - name: Install
        run: cmake --install build-aec3 --prefix "$PWD/install-aec3"
      - name: Verify installed AEC3 backend package from C++17 consumer
        shell: bash
        run: |
          mkdir -p /tmp/libaudition-aec3-consumer
          cat > /tmp/libaudition-aec3-consumer/CMakeLists.txt <<'CMAKE'
          cmake_minimum_required(VERSION 3.20)
          project(libaudition_aec3_consumer LANGUAGES CXX)
          find_package(libaudition CONFIG REQUIRED)
          add_executable(consumer main.cpp)
          target_link_libraries(consumer PRIVATE audition::backend_webrtc_aec3)
          target_compile_features(consumer PRIVATE cxx_std_17)
          CMAKE
          cat > /tmp/libaudition-aec3-consumer/main.cpp <<'CPP'
          #include <audition/backends/webrtc_aec3.hpp>
          int main() {
              audition::WebRtcAec3EchoCanceller backend{};
              return backend.backendInfo().name == "webrtc-aec3" ? 0 : 1;
          }
          CPP
          cmake -S /tmp/libaudition-aec3-consumer             -B /tmp/libaudition-aec3-consumer/build -G Ninja             -DCMAKE_PREFIX_PATH="$PWD/install-aec3"
          cmake --build /tmp/libaudition-aec3-consumer/build --parallel
          LD_LIBRARY_PATH="$PWD/install-aec3/lib:${LD_LIBRARY_PATH:-}"             /tmp/libaudition-aec3-consumer/build/consumer


  sherpa-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt 5 Widgets
        run: |
          sudo apt-get update
          sudo apt-get install -y qtbase5-dev
      - name: Configure sherpa-onnx speech backend
        run: >-
          cmake -S . -B build-sherpa -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DLIBAUDITION_WITH_SHERPA=ON
          -DLIBAUDITION_WITH_SPDLOG=OFF
          -DLIBAUDITION_BUILD_TESTS=ON
          -DLIBAUDITION_BUILD_EXAMPLES=ON
          -DLIBAUDITION_BUILD_QT_DEMO=ON
          -DLIBAUDITION_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build-sherpa --parallel 2
      - name: Headless Qt workbench self-test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./build-sherpa/demo/qt/libaudition_qt_demo --self-test
      - name: Download pinned Silero VAD inference fixture
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            --output "$PWD/build-sherpa/silero_vad.onnx" \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/silero_vad.onnx
          echo "9e2449e1087496d8d4caba907f23e0bd3f78d91fa552479bb9c23ac09cbb1fd6  $PWD/build-sherpa/silero_vad.onnx" | sha256sum --check
      - name: Test
        env:
          LIBAUDITION_TEST_SILERO_MODEL: ${{ github.workspace }}/build-sherpa/silero_vad.onnx
        run: ctest --test-dir build-sherpa --output-on-failure
      - name: Test actual Silero VAD Qt workbench inference
        env:
          QT_QPA_PLATFORM: offscreen
          LIBAUDITION_TEST_SILERO_MODEL: ${{ github.workspace }}/build-sherpa/silero_vad.onnx
        run: ./build-sherpa/demo/qt/libaudition_qt_demo --model-self-test=silero
      - name: Install
        run: cmake --install build-sherpa --prefix "$PWD/install-sherpa"
      - name: Verify installed sherpa backend package from C++17 consumer
        shell: bash
        run: |
          mkdir -p /tmp/libaudition-sherpa-consumer
          cat > /tmp/libaudition-sherpa-consumer/CMakeLists.txt <<'CMAKE'
          cmake_minimum_required(VERSION 3.20)
          project(libaudition_sherpa_consumer LANGUAGES CXX)
          find_package(libaudition CONFIG REQUIRED)
          add_executable(consumer main.cpp)
          target_link_libraries(consumer PRIVATE audition::backend_sherpa)
          target_compile_features(consumer PRIVATE cxx_std_17)
          CMAKE
          cat > /tmp/libaudition-sherpa-consumer/main.cpp <<'CPP'
          #include <audition/backends/sherpa.hpp>
          #include <type_traits>
          int main() {
              audition::SherpaVadOptions options{};
              std::get<audition::SherpaSileroVadModel>(options.model).model = "model.onnx";
              audition::validateSherpaVadOptions(options);

              audition::SherpaAudioTaggingOptions tagging{};
              std::get<audition::SherpaAudioTaggingZipformerModel>(tagging.model).model =
                  "audio-tagger.onnx";
              tagging.labels = "labels.csv";
              audition::validateSherpaAudioTaggingOptions(tagging);

              audition::SherpaSpeechDenoiserOptions denoiser{};
              std::get<audition::SherpaSpeechDenoiserGtcrnModel>(denoiser.model).model =
                  "gtcrn.onnx";
              audition::validateSherpaOfflineSpeechDenoiserOptions(denoiser);
              audition::validateSherpaStreamingSpeechDenoiserOptions(denoiser);
              static_assert(std::is_base_of_v<audition::INoiseSuppressor,
                                              audition::SherpaOfflineSpeechDenoiser>);
              static_assert(std::is_base_of_v<audition::INoiseSuppressor,
                                              audition::SherpaStreamingSpeechDenoiser>);

              audition::SherpaSpeakerIdentifier identifier{{2U, "test-model"}};
              audition::SpeakerEnrollment enrollment{};
              enrollment.speaker_id = audition::SpeakerId{1U};
              enrollment.display_name = "speaker";
              enrollment.embeddings.push_back(
                  {"test-model", {1.0F, 0.0F}, std::nullopt});
              identifier.enroll(enrollment);

              const audition::SpeakerEmbedding query{
                  "test-model", {1.0F, 0.0F}, std::nullopt};
              const auto match = identifier.identify(query, audition::Score{0.5});
              return match.has_value() ? 0 : 1;
          }
          CPP
          cmake -S /tmp/libaudition-sherpa-consumer             -B /tmp/libaudition-sherpa-consumer/build -G Ninja             -DCMAKE_PREFIX_PATH="$PWD/install-sherpa"
          cmake --build /tmp/libaudition-sherpa-consumer/build --parallel
          LD_LIBRARY_PATH="$PWD/install-sherpa/lib:${LD_LIBRARY_PATH:-}"             /tmp/libaudition-sherpa-consumer/build/consumer

  sherpa-tts-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt 5 Widgets
        run: |
          sudo apt-get update
          sudo apt-get install -y qtbase5-dev
      - name: Configure sherpa-onnx TTS backend
        run: >-
          cmake -S . -B build-sherpa-tts -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DLIBAUDITION_WITH_SHERPA=ON
          -DLIBAUDITION_SHERPA_ENABLE_TTS=ON
          -DLIBAUDITION_WITH_SPDLOG=OFF
          -DLIBAUDITION_BUILD_TESTS=ON
          -DLIBAUDITION_BUILD_EXAMPLES=ON
          -DLIBAUDITION_BUILD_QT_DEMO=ON
          -DLIBAUDITION_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build-sherpa-tts --parallel 2
      - name: Headless Qt workbench self-test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./build-sherpa-tts/demo/qt/libaudition_qt_demo --self-test
      - name: Test
        run: ctest --test-dir build-sherpa-tts --output-on-failure
      - name: Install
        run: cmake --install build-sherpa-tts --prefix "$PWD/install-sherpa-tts"
      - name: Verify installed sherpa TTS package from C++17 consumer
        shell: bash
        run: |
          mkdir -p /tmp/libaudition-sherpa-tts-consumer
          cat > /tmp/libaudition-sherpa-tts-consumer/CMakeLists.txt <<'CMAKE'
          cmake_minimum_required(VERSION 3.20)
          project(libaudition_sherpa_tts_consumer LANGUAGES CXX)
          find_package(libaudition CONFIG REQUIRED)
          add_executable(consumer main.cpp)
          target_link_libraries(consumer PRIVATE audition::backend_sherpa)
          target_compile_features(consumer PRIVATE cxx_std_17)
          CMAKE
          cat > /tmp/libaudition-sherpa-tts-consumer/main.cpp <<'CPP'
          #include <audition/backends/sherpa.hpp>
          #include <type_traits>

          #if !defined(LIBAUDITION_SHERPA_TTS_ENABLED)
          #error "Installed sherpa target must propagate TTS support"
          #endif

          int main() {
              audition::SherpaTtsOptions options{};
              auto& model = std::get<audition::SherpaTtsVitsModel>(options.model);
              model.model = "voice.onnx";
              model.tokens = "tokens.txt";
              model.data_dir = "espeak-ng-data";
              options.languages = {"en"};
              audition::validateSherpaTtsOptions(options);
              static_assert(std::is_base_of_v<audition::ISpeechSynthesizer,
                                              audition::SherpaTts>);
              return 0;
          }
          CPP
          cmake -S /tmp/libaudition-sherpa-tts-consumer \
            -B /tmp/libaudition-sherpa-tts-consumer/build -G Ninja \
            -DCMAKE_PREFIX_PATH="$PWD/install-sherpa-tts"
          cmake --build /tmp/libaudition-sherpa-tts-consumer/build --parallel
          LD_LIBRARY_PATH="$PWD/install-sherpa-tts/lib:${LD_LIBRARY_PATH:-}" \
            /tmp/libaudition-sherpa-tts-consumer/build/consumer

  clap-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt 5 Widgets
        run: |
          sudo apt-get update
          sudo apt-get install -y qtbase5-dev
      - name: Configure CLAP ONNX backend
        run: >-
          cmake -S . -B build-clap -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DLIBAUDITION_WITH_CLAP=ON
          -DLIBAUDITION_WITH_SPDLOG=OFF
          -DLIBAUDITION_BUILD_TESTS=ON
          -DLIBAUDITION_BUILD_EXAMPLES=ON
          -DLIBAUDITION_BUILD_QT_DEMO=ON
          -DLIBAUDITION_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build-clap --parallel
      - name: Headless Qt workbench self-test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./build-clap/demo/qt/libaudition_qt_demo --self-test
      - name: Download pinned CLAP inference fixtures
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            --output "$PWD/build-clap/clap_audio.onnx" \
            "https://huggingface.co/ConceptualMachines/magda-sample-tagger/resolve/main/clap_audio.onnx?download=true"
          curl --fail --location --retry 3 \
            --output "$PWD/build-clap/clap_text.onnx" \
            "https://huggingface.co/ConceptualMachines/magda-sample-tagger/resolve/main/clap_text.onnx?download=true"
          curl --fail --location --retry 3 \
            --output "$PWD/build-clap/tokenizer.json" \
            "https://huggingface.co/ConceptualMachines/magda-sample-tagger/resolve/main/tokenizer.json?download=true"
          echo "3f42f71e555b62709910b6efa66fa5879f00d9571874b12b0fa674f82dbfe332  $PWD/build-clap/clap_audio.onnx" | sha256sum --check
          echo "c07b27204836877d5b615c103685b66ea8f21bc6b5b70a572be356125423a8bf  $PWD/build-clap/clap_text.onnx" | sha256sum --check
          echo "4fd1d86b4f5b53f40a609fcd11c1f34024b735f870a07439d70202b98493661a  $PWD/build-clap/tokenizer.json" | sha256sum --check
      - name: Generate tokenizer parity vectors
        shell: bash
        run: |
          python3 -m pip install --disable-pip-version-check --no-input "tokenizers==0.22.1"
          python3 - <<'PY'
          from pathlib import Path
          from tokenizers import Tokenizer

          root = Path("build-clap")
          tokenizer = Tokenizer.from_file(str(root / "tokenizer.json"))
          tokenizer.enable_truncation(max_length=77)
          tokenizer.enable_padding(length=77, pad_id=1, pad_token="<pad>")

          prompts = [
              "warm analog pad",
              "glass breaking",
              "door knock",
              "speech",
              "a loud alarm ringing",
          ]

          with (root / "tokenizer_golden.tsv").open("w", encoding="utf-8") as out:
              for prompt in prompts:
                  encoded = tokenizer.encode(prompt)
                  out.write(
                      prompt
                      + "\t"
                      + ",".join(str(value) for value in encoded.ids)
                      + "\t"
                      + ",".join(str(value) for value in encoded.attention_mask)
                      + "\n"
                  )
          PY
      - name: Test
        env:
          LIBAUDITION_TEST_CLAP_AUDIO_MODEL: ${{ github.workspace }}/build-clap/clap_audio.onnx
          LIBAUDITION_TEST_CLAP_TEXT_MODEL: ${{ github.workspace }}/build-clap/clap_text.onnx
          LIBAUDITION_TEST_CLAP_TOKENIZER: ${{ github.workspace }}/build-clap/tokenizer.json
          LIBAUDITION_TEST_CLAP_TOKENIZER_GOLDEN: ${{ github.workspace }}/build-clap/tokenizer_golden.tsv
        run: ctest --test-dir build-clap --output-on-failure
      - name: Test actual CLAP Qt workbench inference
        env:
          QT_QPA_PLATFORM: offscreen
          LIBAUDITION_TEST_CLAP_AUDIO_MODEL: ${{ github.workspace }}/build-clap/clap_audio.onnx
          LIBAUDITION_TEST_CLAP_TEXT_MODEL: ${{ github.workspace }}/build-clap/clap_text.onnx
          LIBAUDITION_TEST_CLAP_TOKENIZER: ${{ github.workspace }}/build-clap/tokenizer.json
        run: ./build-clap/demo/qt/libaudition_qt_demo --model-self-test=clap
      - name: Install
        run: cmake --install build-clap --prefix "$PWD/install-clap"
      - name: Verify installed CLAP package from C++17 consumer
        shell: bash
        run: |
          mkdir -p /tmp/libaudition-clap-consumer
          cat > /tmp/libaudition-clap-consumer/CMakeLists.txt <<'CMAKE'
          cmake_minimum_required(VERSION 3.20)
          project(libaudition_clap_consumer LANGUAGES CXX)
          find_package(libaudition CONFIG REQUIRED)
          add_executable(consumer main.cpp)
          target_link_libraries(consumer PRIVATE audition::backend_clap)
          target_compile_features(consumer PRIVATE cxx_std_17)
          CMAKE
          cat > /tmp/libaudition-clap-consumer/main.cpp <<'CPP'
          #include <audition/backends/clap.hpp>
          #include <type_traits>
          int main() {
              audition::ClapOnnxAudioOptions audio{};
              audio.model = "clap_audio.onnx";
              audition::validateClapOnnxAudioOptions(audio);

              audition::ClapOnnxTextOptions text{};
              text.model = "clap_text.onnx";
              text.tokenizer = "tokenizer.json";
              audition::validateClapOnnxTextOptions(text);

              audition::ClapOpenVocabularyOptions classifier{};
              classifier.audio = audio;
              classifier.text = text;
              audition::validateClapOpenVocabularyOptions(classifier);

              static_assert(std::is_base_of_v<audition::IAudioEmbedder,
                                              audition::ClapAudioEmbedder>);
              static_assert(std::is_base_of_v<audition::IOpenVocabularyAudioClassifier,
                                              audition::ClapOpenVocabularyClassifier>);
              return 0;
          }
          CPP
          cmake -S /tmp/libaudition-clap-consumer \
            -B /tmp/libaudition-clap-consumer/build -G Ninja \
            -DCMAKE_PREFIX_PATH="$PWD/install-clap"
          cmake --build /tmp/libaudition-clap-consumer/build --parallel
          LD_LIBRARY_PATH="$PWD/install-clap/lib:${LD_LIBRARY_PATH:-}" \
            /tmp/libaudition-clap-consumer/build/consumer


  aasist-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt 5 Widgets
        run: |
          sudo apt-get update
          sudo apt-get install -y qtbase5-dev
      - name: Configure AASIST ONNX backend
        run: >-
          cmake -S . -B build-aasist -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DLIBAUDITION_WITH_AASIST=ON
          -DLIBAUDITION_WITH_SPDLOG=OFF
          -DLIBAUDITION_BUILD_TESTS=ON
          -DLIBAUDITION_BUILD_EXAMPLES=ON
          -DLIBAUDITION_BUILD_QT_DEMO=ON
          -DLIBAUDITION_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build-aasist --parallel
      - name: Headless Qt workbench self-test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./build-aasist/demo/qt/libaudition_qt_demo --self-test
      - name: Download pinned AASIST inference fixture
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            --output "$PWD/build-aasist/aasist.onnx" \
            "https://huggingface.co/SpeechAntiSpoofingBenchmarks/AASIST/resolve/16774d458d86d2a021ae31646c1bf66a5331b53e/aasist.onnx?download=true"
          echo "130e536266b7c537f9a13029e1612a9f392fd1cc827783683b6d1c062a3db5e1  $PWD/build-aasist/aasist.onnx" | sha256sum --check
      - name: Test
        env:
          LIBAUDITION_TEST_AASIST_MODEL: ${{ github.workspace }}/build-aasist/aasist.onnx
        run: ctest --test-dir build-aasist --output-on-failure
      - name: Test actual AASIST Qt workbench inference
        env:
          QT_QPA_PLATFORM: offscreen
          LIBAUDITION_TEST_AASIST_MODEL: ${{ github.workspace }}/build-aasist/aasist.onnx
        run: ./build-aasist/demo/qt/libaudition_qt_demo --model-self-test=aasist
      - name: Install
        run: cmake --install build-aasist --prefix "$PWD/install-aasist"
      - name: Verify installed AASIST package from C++17 consumer
        shell: bash
        run: |
          mkdir -p /tmp/libaudition-aasist-consumer
          cat > /tmp/libaudition-aasist-consumer/CMakeLists.txt <<'CMAKE'
          cmake_minimum_required(VERSION 3.20)
          project(libaudition_aasist_consumer LANGUAGES CXX)
          find_package(libaudition CONFIG REQUIRED)
          add_executable(consumer main.cpp)
          target_link_libraries(consumer PRIVATE audition::backend_aasist)
          target_compile_features(consumer PRIVATE cxx_std_17)
          CMAKE
          cat > /tmp/libaudition-aasist-consumer/main.cpp <<'CPP'
          #include <audition/backends/aasist.hpp>
          #include <type_traits>

          int main() {
              audition::AasistOnnxOptions options{};
              options.model = "aasist.onnx";
              audition::validateAasistOnnxOptions(options);
              static_assert(
                  std::is_base_of_v<
                      audition::IAudioAuthenticityDetector,
                      audition::AasistAuthenticityDetector>);
              return 0;
          }
          CPP
          cmake -S /tmp/libaudition-aasist-consumer \
            -B /tmp/libaudition-aasist-consumer/build -G Ninja \
            -DCMAKE_PREFIX_PATH="$PWD/install-aasist"
          cmake --build /tmp/libaudition-aasist-consumer/build --parallel
          LD_LIBRARY_PATH="$PWD/install-aasist/lib:${LD_LIBRARY_PATH:-}" \
            /tmp/libaudition-aasist-consumer/build/consumer


