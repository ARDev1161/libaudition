name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Check Ninja
        run: ninja --version
      - name: Configure
        run: cmake --preset ci
      - name: Build
        run: cmake --build --preset ci --parallel
      - name: Test
        run: ctest --preset ci

  minimal-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Ninja
        run: ninja --version
      - name: Configure without optional dependencies
        run: cmake --preset minimal
      - name: Build
        run: cmake --build --preset minimal --parallel

  odas-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ODAS build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libfftw3-dev libasound2-dev libconfig-dev libpulse-dev
      - name: Configure with direct ODAS backend
        run: >-
          cmake -S . -B build-odas -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DLIBAUDITION_WITH_ODAS=ON
          -DLIBAUDITION_WITH_SPDLOG=OFF
          -DLIBAUDITION_BUILD_TESTS=ON
          -DLIBAUDITION_BUILD_EXAMPLES=ON
          -DLIBAUDITION_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build-odas --parallel
      - name: Test
        run: ctest --test-dir build-odas --output-on-failure
      - name: Install
        run: cmake --install build-odas --prefix "$PWD/install-odas"
      - name: Verify installed ODAS backend package
        shell: bash
        run: |
          mkdir -p /tmp/libaudition-odas-consumer
          cat > /tmp/libaudition-odas-consumer/CMakeLists.txt <<'CMAKE'
          cmake_minimum_required(VERSION 3.20)
          project(libaudition_odas_consumer LANGUAGES CXX)
          find_package(libaudition CONFIG REQUIRED)
          add_executable(consumer main.cpp)
          target_link_libraries(consumer PRIVATE audition::backend_odas)
          target_compile_features(consumer PRIVATE cxx_std_17)
          CMAKE
          cat > /tmp/libaudition-odas-consumer/main.cpp <<'CPP'
          #include <audition/backends/odas.hpp>
          int main() {
              audition::OdasOptions options{};
              return options.sample_rate_hz == 16000U ? 0 : 1;
          }
          CPP
          cmake -S /tmp/libaudition-odas-consumer -B /tmp/libaudition-odas-consumer/build -G Ninja             -DCMAKE_PREFIX_PATH="$PWD/install-odas"
          cmake --build /tmp/libaudition-odas-consumer/build --parallel


  samplerate-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure libsamplerate backend
        run: >-
          cmake -S . -B build-samplerate -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DLIBAUDITION_WITH_LIBSAMPLERATE=ON
          -DLIBAUDITION_WITH_SPDLOG=OFF
          -DLIBAUDITION_BUILD_TESTS=ON
          -DLIBAUDITION_BUILD_EXAMPLES=ON
          -DLIBAUDITION_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build-samplerate --parallel
      - name: Test
        run: ctest --test-dir build-samplerate --output-on-failure
      - name: Install
        run: cmake --install build-samplerate --prefix "$PWD/install-samplerate"
      - name: Verify installed libsamplerate backend package
        shell: bash
        run: |
          mkdir -p /tmp/libaudition-samplerate-consumer
          cat > /tmp/libaudition-samplerate-consumer/CMakeLists.txt <<'CMAKE'
          cmake_minimum_required(VERSION 3.20)
          project(libaudition_samplerate_consumer LANGUAGES CXX)
          find_package(libaudition CONFIG REQUIRED)
          add_executable(consumer main.cpp)
          target_link_libraries(consumer PRIVATE audition::backend_samplerate)
          target_compile_features(consumer PRIVATE cxx_std_17)
          CMAKE
          cat > /tmp/libaudition-samplerate-consumer/main.cpp <<'CPP'
          #include <audition/backends/samplerate.hpp>
          int main() {
              audition::SamplerateResampler backend{};
              return backend.backendInfo().name == "libsamplerate" ? 0 : 1;
          }
          CPP
          cmake -S /tmp/libaudition-samplerate-consumer             -B /tmp/libaudition-samplerate-consumer/build -G Ninja             -DCMAKE_PREFIX_PATH="$PWD/install-samplerate"
          cmake --build /tmp/libaudition-samplerate-consumer/build --parallel

  aec3-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure WebRTC AEC3 backend
        run: >-
          cmake -S . -B build-aec3 -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DLIBAUDITION_WITH_WEBRTC_AEC3=ON
          -DLIBAUDITION_WITH_SPDLOG=OFF
          -DLIBAUDITION_BUILD_TESTS=ON
          -DLIBAUDITION_BUILD_EXAMPLES=ON
          -DLIBAUDITION_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build-aec3 --parallel
      - name: Test
        run: ctest --test-dir build-aec3 --output-on-failure
      - name: Install
        run: cmake --install build-aec3 --prefix "$PWD/install-aec3"
      - name: Verify installed AEC3 backend package from C++17 consumer
        shell: bash
        run: |
          mkdir -p /tmp/libaudition-aec3-consumer
          cat > /tmp/libaudition-aec3-consumer/CMakeLists.txt <<'CMAKE'
          cmake_minimum_required(VERSION 3.20)
          project(libaudition_aec3_consumer LANGUAGES CXX)
          find_package(libaudition CONFIG REQUIRED)
          add_executable(consumer main.cpp)
          target_link_libraries(consumer PRIVATE audition::backend_webrtc_aec3)
          target_compile_features(consumer PRIVATE cxx_std_17)
          CMAKE
          cat > /tmp/libaudition-aec3-consumer/main.cpp <<'CPP'
          #include <audition/backends/webrtc_aec3.hpp>
          int main() {
              audition::WebRtcAec3EchoCanceller backend{};
              return backend.backendInfo().name == "webrtc-aec3" ? 0 : 1;
          }
          CPP
          cmake -S /tmp/libaudition-aec3-consumer             -B /tmp/libaudition-aec3-consumer/build -G Ninja             -DCMAKE_PREFIX_PATH="$PWD/install-aec3"
          cmake --build /tmp/libaudition-aec3-consumer/build --parallel
          LD_LIBRARY_PATH="$PWD/install-aec3/lib:${LD_LIBRARY_PATH:-}"             /tmp/libaudition-aec3-consumer/build/consumer


  sherpa-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure sherpa-onnx speech backend
        run: >-
          cmake -S . -B build-sherpa -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DLIBAUDITION_WITH_SHERPA=ON
          -DLIBAUDITION_WITH_SPDLOG=OFF
          -DLIBAUDITION_BUILD_TESTS=ON
          -DLIBAUDITION_BUILD_EXAMPLES=ON
          -DLIBAUDITION_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build-sherpa --parallel 2
      - name: Download pinned Silero VAD inference fixture
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            --output "$PWD/build-sherpa/silero_vad.onnx" \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/silero_vad.onnx
          echo "9e2449e1087496d8d4caba907f23e0bd3f78d91fa552479bb9c23ac09cbb1fd6  $PWD/build-sherpa/silero_vad.onnx" | sha256sum --check
      - name: Test
        env:
          LIBAUDITION_TEST_SILERO_MODEL: ${{ github.workspace }}/build-sherpa/silero_vad.onnx
        run: ctest --test-dir build-sherpa --output-on-failure
      - name: Install
        run: cmake --install build-sherpa --prefix "$PWD/install-sherpa"
      - name: Verify installed sherpa backend package from C++17 consumer
        shell: bash
        run: |
          mkdir -p /tmp/libaudition-sherpa-consumer
          cat > /tmp/libaudition-sherpa-consumer/CMakeLists.txt <<'CMAKE'
          cmake_minimum_required(VERSION 3.20)
          project(libaudition_sherpa_consumer LANGUAGES CXX)
          find_package(libaudition CONFIG REQUIRED)
          add_executable(consumer main.cpp)
          target_link_libraries(consumer PRIVATE audition::backend_sherpa)
          target_compile_features(consumer PRIVATE cxx_std_17)
          CMAKE
          cat > /tmp/libaudition-sherpa-consumer/main.cpp <<'CPP'
          #include <audition/backends/sherpa.hpp>
          int main() {
              audition::SherpaVadOptions options{};
              std::get<audition::SherpaSileroVadModel>(options.model).model = "model.onnx";
              audition::validateSherpaVadOptions(options);
              return 0;
          }
          CPP
          cmake -S /tmp/libaudition-sherpa-consumer             -B /tmp/libaudition-sherpa-consumer/build -G Ninja             -DCMAKE_PREFIX_PATH="$PWD/install-sherpa"
          cmake --build /tmp/libaudition-sherpa-consumer/build --parallel
          LD_LIBRARY_PATH="$PWD/install-sherpa/lib:${LD_LIBRARY_PATH:-}"             /tmp/libaudition-sherpa-consumer/build/consumer
