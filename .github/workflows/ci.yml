  sherpa-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt 5 Widgets and reproducible speech fixture tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qtbase5-dev espeak-ng ffmpeg
      - name: Configure sherpa-onnx speech backend
        run: >-
          cmake -S . -B build-sherpa -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DLIBAUDITION_WITH_SHERPA=ON
          -DLIBAUDITION_REGISTER_INSTALLED_PACKAGE_SMOKE=ON
          -DLIBAUDITION_PACKAGE_SMOKE_PREFIX=$PWD/install-sherpa
          -DLIBAUDITION_WITH_SPDLOG=OFF
          -DLIBAUDITION_BUILD_TESTS=ON
          -DLIBAUDITION_REGISTER_REAL_QT_MODEL_TESTS=ON
          -DLIBAUDITION_BUILD_EXAMPLES=ON
          -DLIBAUDITION_BUILD_QT_DEMO=ON
          -DLIBAUDITION_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build-sherpa --parallel 2
      - name: Headless Qt workbench self-test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build-sherpa -R '^qt_self_test$' --output-on-failure
      - name: Test asynchronous Sherpa GUI error and restart paths
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build-sherpa -R '^qt_sherpa_errors$' --output-on-failure
      - name: Download pinned Silero VAD inference fixture
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            --output "$PWD/build-sherpa/silero_vad.onnx" \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/silero_vad.onnx
          echo "9e2449e1087496d8d4caba907f23e0bd3f78d91fa552479bb9c23ac09cbb1fd6  $PWD/build-sherpa/silero_vad.onnx" | sha256sum --check
      - name: Test
        env:
          LIBAUDITION_TEST_SILERO_MODEL: ${{ github.workspace }}/build-sherpa/silero_vad.onnx
        run: ctest --test-dir build-sherpa -LE 'real-model|installed-package' --output-on-failure
      - name: Test actual Silero VAD Qt workbench inference
        env:
          QT_QPA_PLATFORM: offscreen
          LIBAUDITION_TEST_SILERO_MODEL: ${{ github.workspace }}/build-sherpa/silero_vad.onnx
        run: ctest --test-dir build-sherpa -R '^qt_real_silero$' --output-on-failure
      - name: Download pinned Whisper tiny.en INT8 and NeMo speaker model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-sherpa/whisper
          # Fixed Hugging Face repository revision and file SHA-256 hashes.
          whisper=https://huggingface.co/csukuangfj/sherpa-onnx-whisper-tiny.en/resolve/d026532c022fa99fd789d6b32446a1df7b6bfc43
          curl --fail --location --retry 3 \
            --output build-sherpa/whisper/tiny.en-encoder.int8.onnx \
            "$whisper/tiny.en-encoder.int8.onnx"
          curl --fail --location --retry 3 \
            --output build-sherpa/whisper/tiny.en-decoder.int8.onnx \
            "$whisper/tiny.en-decoder.int8.onnx"
          curl --fail --location --retry 3 \
            --output build-sherpa/whisper/tiny.en-tokens.txt \
            "$whisper/tiny.en-tokens.txt"
          echo "0ce578b827c94a961aacb8fa14b02f096504b337e5c94be37c36238cbe3e8bc6  build-sherpa/whisper/tiny.en-encoder.int8.onnx" | sha256sum --check
          echo "06c0e6ff6348d427e51839219d1c886c18cfdf411e629e33f5e1679bff9c1527  build-sherpa/whisper/tiny.en-decoder.int8.onnx" | sha256sum --check
          test -s build-sherpa/whisper/tiny.en-tokens.txt
          curl --fail --location --retry 3 \
            --output build-sherpa/nemo_en_titanet_small.onnx \
            https://huggingface.co/csukuangfj/speaker-embedding-models/resolve/2b697b2/nemo_en_titanet_small.onnx
          echo "ad4a1802485d8b34c722d2a9d04249662f2ece5d28a7a039063ca22f515a789e  build-sherpa/nemo_en_titanet_small.onnx" | sha256sum --check
      - name: Test actual Whisper tiny.en ONNX inference via Qt
        env:
          QT_QPA_PLATFORM: offscreen
          LIBAUDITION_TEST_WHISPER_ENCODER: ${{ github.workspace }}/build-sherpa/whisper/tiny.en-encoder.int8.onnx
          LIBAUDITION_TEST_WHISPER_DECODER: ${{ github.workspace }}/build-sherpa/whisper/tiny.en-decoder.int8.onnx
          LIBAUDITION_TEST_WHISPER_TOKENS: ${{ github.workspace }}/build-sherpa/whisper/tiny.en-tokens.txt
        run: ctest --test-dir build-sherpa -R '^qt_real_whisper-real$' --output-on-failure
      - name: Verify genuine Whisper ONNX through per-source speech runtime
        run: ctest --test-dir build-sherpa -R '^speech_real_whisper_two_sources$' --output-on-failure
      - name: Test actual speaker embedding verification and identification via Qt
        env:
          QT_QPA_PLATFORM: offscreen
          LIBAUDITION_TEST_SPEAKER_MODEL: ${{ github.workspace }}/build-sherpa/nemo_en_titanet_small.onnx
        run: ctest --test-dir build-sherpa -R '^qt_real_speaker-real$' --output-on-failure
      - name: Download SHA-256 pinned SenseVoiceSmall INT8 ASR and tokens
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-sherpa/sensevoice
          base=https://huggingface.co/nocmt/SenseVoiceSmall-INT8-ONNX/resolve/main
          curl --fail --location --retry 3 \
            -o build-sherpa/sensevoice/model.int8.onnx \
            "$base/model.int8.onnx"
          curl --fail --location --retry 3 \
            -o build-sherpa/sensevoice/tokens.txt \
            "$base/tokens.txt"
          echo 'c71f0ce00bec95b07744e116345e33d8cbbe08cef896382cf907bf4b51a2cd51  build-sherpa/sensevoice/model.int8.onnx' | sha256sum -c -
          echo 'f449eb28dc567533d7fa59be34e2abca8784f771850c78a47fb731a31429a1dc  build-sherpa/sensevoice/tokens.txt' | sha256sum -c -
      - name: Synthesize speech fixture with a known transcript
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-sherpa/audio-fixtures
          espeak-ng -v en-us -s 135 \
            -w build-sherpa/audio-fixtures/utterance-source.wav \
            'Hello robot. Please go forward and stop at the door.'
          ffmpeg -hide_banner -loglevel error -y \
            -i build-sherpa/audio-fixtures/utterance-source.wav \
            -ac 1 -ar 16000 -c:a pcm_s16le \
            build-sherpa/audio-fixtures/utterance.wav
          test -s build-sherpa/audio-fixtures/utterance.wav
      - name: Download versioned GigaSpeech KWS INT8 model and attributed WAV
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/kws-gigaspeech-3.3m-2024.tar.bz2"
          curl --fail --location --retry 3 --silent --show-error \
            --output "$archive" \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/kws-models/sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01.tar.bz2
          test "$(wc -c < "$archive")" -eq 17626723
          checksums="$RUNNER_TEMP/kws-checksum.txt"
          curl --fail --location --retry 3 --silent --show-error \
            --output "$checksums" \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/kws-models/checksum.txt
          echo '284637b2b9fec1287aca10315dcc960710c6ec14224fb1dfa9fe427e77eb6c18  '"$checksums" | sha256sum --check
          # Upstream checksum.txt is separately pinned above. Do not assume
          # the filename is its last whitespace-delimited field, or that the
          # digest precedes the filename (GNU/BSD/filename-first formats differ).
          python3 - "$archive" "$checksums" <<'PY'
          import hashlib
          from pathlib import Path
          import re
          import sys

          archive, manifest = map(Path, sys.argv[1:3])
          name = "sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01.tar.bz2"
          lines = [line for line in manifest.read_text(encoding="utf-8").splitlines()
                   if name in line]
          if len(lines) != 1:
              raise SystemExit(
                  f"Expected exactly one KWS archive checksum entry, found {len(lines)}. "
                  f"Verified release checksum contents: {manifest.read_text()!r}")
          hashes = re.findall(r"(?<![0-9a-fA-F])[0-9a-fA-F]{64}(?![0-9a-fA-F])", lines[0])
          if len(hashes) != 1:
              raise SystemExit(f"Cannot parse SHA-256 checksum line: {lines[0]!r}")
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          if digest.lower() != hashes[0].lower():
              raise SystemExit(f"KWS archive checksum mismatch: expected {hashes[0]}, got {digest}")
          print(f"KWS upstream SHA-256 verified: {digest}", flush=True)
          PY
          sha256sum "$archive" | tee build-sherpa/kws-archive.sha256
          python3 - "$archive" "$PWD/build-sherpa" <<'PY'
          import pathlib
          import sys
          import tarfile
          archive = pathlib.Path(sys.argv[1])
          target = pathlib.Path(sys.argv[2])
          with tarfile.open(archive, "r:bz2") as package:
              package.extractall(target, filter="data")
          PY
          mv build-sherpa/sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01 build-sherpa/kws-gigaspeech
          test -s build-sherpa/kws-gigaspeech/test_wavs/test_keywords.txt
          test -s build-sherpa/kws-gigaspeech/test_wavs/0.wav
      - name: Check GigaSpeech KWS against labeled WAV and silence through CTest
        run: ctest --test-dir build-sherpa -R '^speech_real_kws_gigaspeech$' --output-on-failure --no-tests=error
      - name: Download checksum-verified small English Streaming Zipformer ASR
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/zipformer-asr-20m-mobile.tar.bz2"
          manifest="$RUNNER_TEMP/asr-models-checksum.txt"
          curl --fail --location --retry 3 --silent --show-error \
            --output "$archive" \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-streaming-zipformer-en-20M-2023-02-17-mobile.tar.bz2
          test "$(wc -c < "$archive")" -eq 107569151
          curl --fail --location --retry 3 --silent --show-error \
            --output "$manifest" \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/checksum.txt
          echo '4e34edcb64434bcf533afaee9dcc14b5b2f9c277ed3a745f263e79a4464b28d0  '"$manifest" | sha256sum --check
          python3 - "$archive" "$manifest" "$PWD/build-sherpa" <<'PY'
          import hashlib
          from pathlib import Path
          import re
          import shutil
          import sys
          import tarfile

          archive, manifest, destination = map(Path, sys.argv[1:4])
          name = "sherpa-onnx-streaming-zipformer-en-20M-2023-02-17-mobile.tar.bz2"
          lines = [s for s in manifest.read_text(encoding="utf-8").splitlines()
                   if name in s]
          if len(lines) != 1:
              raise SystemExit(f"Expected exactly one Streaming ASR checksum entry, got {len(lines)}")
          hashes = re.findall(r"(?<![0-9a-fA-F])[0-9a-fA-F]{64}(?![0-9a-fA-F])", lines[0])
          if len(hashes) != 1:
              raise SystemExit(f"Invalid Streaming ASR checksum line: {lines[0]!r}")
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          if digest.lower() != hashes[0].lower():
              raise SystemExit("Streaming ASR archive SHA-256 mismatch")
          print(f"Verified Streaming ASR archive SHA-256: {digest}", flush=True)
          with tarfile.open(archive, "r:bz2") as package:
              package.extractall(destination, filter="data")
          dirs = [p for p in destination.glob(
              "sherpa-onnx-streaming-zipformer-en-20M-2023-02-17*") if p.is_dir()]
          if len(dirs) != 1:
              raise SystemExit(f"Unexpected Streaming ASR extracted directories: {dirs!r}")
          root = dirs[0]
          for file in ("encoder-epoch-99-avg-1.int8.onnx",
                       "decoder-epoch-99-avg-1.onnx",
                       "joiner-epoch-99-avg-1.int8.onnx", "tokens.txt"):
              if not (root / file).is_file() or (root / file).stat().st_size == 0:
                  raise SystemExit(f"Missing required Streaming ASR weight: {file}")
          shutil.move(str(root), str(destination / "streaming-asr-zipformer"))
          PY
          sha256sum "$archive" | tee build-sherpa/audio-fixtures/streaming-asr-model.sha256
      - name: Verify real incremental Streaming ASR with finalization and reset
        run: |
          ctest --test-dir build-sherpa -R '^speech_real_streaming_asr_zipformer$' --output-on-failure --no-tests=error
          cat build-sherpa/audio-fixtures/streaming-asr-report.txt
      - name: Fetch SHA-256 verified multilingual Whisper Tiny and labeled language WAVs
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models"
          weights="$RUNNER_TEMP/language-id-whisper-tiny.tar.bz2"
          waves="$RUNNER_TEMP/language-id-test-wavs.tar.bz2"
          manifest="$RUNNER_TEMP/language-id-checksum.txt"
          curl --fail --location --retry 3 --silent --show-error \
            -o "$weights" "$base/sherpa-onnx-whisper-tiny.tar.bz2"
          curl --fail --location --retry 3 --silent --show-error \
            -o "$waves" "$base/spoken-language-identification-test-wavs.tar.bz2"
          curl --fail --location --retry 3 --silent --show-error \
            -o "$manifest" "$base/checksum.txt"
          echo '4e34edcb64434bcf533afaee9dcc14b5b2f9c277ed3a745f263e79a4464b28d0  '"$manifest" | sha256sum --check
          python3 - "$weights" "$waves" "$manifest" "$PWD/build-sherpa" <<'PY'
          import hashlib
          from pathlib import Path
          import re
          import shutil
          import sys
          import tarfile

          weights, waves, manifest, root = map(Path, sys.argv[1:5])
          expected = {
              weights: ("sherpa-onnx-whisper-tiny.tar.bz2", 116204861),
              waves: ("spoken-language-identification-test-wavs.tar.bz2", 3324009),
          }
          lines = manifest.read_text(encoding="utf-8").splitlines()
          for archive, (name, size) in expected.items():
              if archive.stat().st_size != size:
                  raise SystemExit(f"Language-ID archive size mismatch for {name}")
              matches = [line for line in lines if name in line]
              if len(matches) != 1:
                  raise SystemExit(f"Expected one SHA-256 manifest entry for {name}, got {len(matches)}")
              hashes = re.findall(r"(?<![0-9a-fA-F])[0-9a-fA-F]{64}(?![0-9a-fA-F])", matches[0])
              if len(hashes) != 1:
                  raise SystemExit(f"Cannot parse SHA-256 for {name}: {matches[0]!r}")
              actual = hashlib.sha256(archive.read_bytes()).hexdigest()
              if actual.lower() != hashes[0].lower():
                  raise SystemExit(f"Language-ID SHA-256 mismatch for {name}")
              print(f"Validated {name} SHA-256: {actual}", flush=True)
              with tarfile.open(archive, "r:bz2") as package:
                  package.extractall(root, filter="data")
          sources = {
              root / "sherpa-onnx-whisper-tiny": root / "language-id-whisper-tiny",
              root / "spoken-language-identification-test-wavs": root / "language-id-wavs",
          }
          for source, target in sources.items():
              if not source.is_dir():
                  raise SystemExit(f"Language-ID extracted folder missing: {source}")
              shutil.move(str(source), str(target))
          required = (
              root / "language-id-whisper-tiny" / "tiny-encoder.int8.onnx",
              root / "language-id-whisper-tiny" / "tiny-decoder.int8.onnx",
              root / "language-id-wavs" / "en-english.wav",
              root / "language-id-wavs" / "de-german.wav",
          )
          for path in required:
              if not path.is_file() or not path.stat().st_size:
                  raise SystemExit(f"Language-ID fixture missing: {path}")
          PY
          sha256sum "$weights" "$waves" | tee build-sherpa/audio-fixtures/language-id-assets.sha256
      - name: Run real multilingual Whisper Language Identification CTest
        run: |
          ctest --test-dir build-sherpa -R '^speech_real_language_id_whisper$' --output-on-failure --no-tests=error
          cat build-sherpa/audio-fixtures/language-id-report.txt
      - name: Download upstream speaker segmentation and embedding reference fixtures
        shell: bash
        run: |
          set -euo pipefail
          base=https://github.com/k2-fsa/sherpa-onnx/releases/download
          archive="$RUNNER_TEMP/pyannote-segmentation-3-0.tar.bz2"
          embedding="$PWD/build-sherpa/diarization-embedding.onnx"
          wav="$PWD/build-sherpa/diarization-two-speakers.wav"
          curl --fail --location --retry 3 --silent --show-error \
            -o "$archive" "$base/speaker-segmentation-models/sherpa-onnx-pyannote-segmentation-3-0.tar.bz2"
          curl --fail --location --retry 3 --silent --show-error \
            -o "$embedding" "$base/speaker-recongition-models/3dspeaker_speech_eres2net_base_sv_zh-cn_3dspeaker_16k.onnx"
          curl --fail --location --retry 3 --silent --show-error \
            -o "$wav" "$base/speaker-segmentation-models/1-two-speakers-en.wav"
          # Immutable exact file hashes from the successful real-model CI #1032.
          # Fail closed on upstream file replacement before model loading.
          echo '24615ee884c897d9d2ba09bb4d30da6bb1b15e685065962db5b02e76e4996488  '"$archive" | sha256sum --check
          echo '1a331345f04805badbb495c775a6ddffcdd1a732567d5ec8b3d5749e3c7a5e4b  '"$embedding" | sha256sum --check
          echo 'f1c877dc01595e28be7147bf2fe38e5268147a868bf3fdb5c37b97f5940e21f3  '"$wav" | sha256sum --check
          sha256sum "$archive" "$embedding" "$wav" | tee build-sherpa/audio-fixtures/diarization-assets.sha256
          python3 - "$archive" "$PWD/build-sherpa" <<'PY'
          from pathlib import Path
          import shutil
          import sys
          import tarfile

          archive, root = map(Path, sys.argv[1:3])
          with tarfile.open(archive, "r:bz2") as package:
              package.extractall(root, filter="data")
          source = root / "sherpa-onnx-pyannote-segmentation-3-0"
          if not (source / "model.onnx").is_file():
              raise SystemExit("Missing Pyannote 3.0 segmentation ONNX after extraction")
          shutil.move(str(source), str(root / "diarization-segmentation"))
          PY
      - name: Run two-speaker regression and unconstrained diarization benchmark smoke
        run: |
          ctest --test-dir build-sherpa -R '^speech_real_speaker_diarization(_benchmark)?$' --output-on-failure --no-tests=error
          cat build-sherpa/audio-fixtures/speaker-diarization-report.txt
          python3 tests/integration/score_diarization_rttm.py \
            --validate-hypothesis build-sherpa/audio-fixtures/speaker-diarization-report.rttm
          python3 tests/integration/score_diarization_rttm.py \
            --validate-hypothesis build-sherpa/audio-fixtures/diarization-benchmark.rttm
          # The benchmark smoke checks output schema, NOT DER; no independent RTTM ground truth.
      - name: Fetch version-pinned independently annotated 10s speaker recording
        shell: bash
        run: |
          set -euo pipefail
          # FHS Brain Aging Program toolkit example has a separate human-labeled
          # ground_truth_files RTTM; do NOT use its sample_files model prediction.
          # Download bytes only at runtime, preserve public provenance.
          upstream="https://raw.githubusercontent.com/Digital-Working-Group/speaker-diarization/9d9ebfcdc08cde1831be697ff5fb22269737a28d"
          root="build-sherpa/audio-fixtures/diarization-reference"
          mkdir -p "$root/reference" "$root/wav"
          wav_archive="$RUNNER_TEMP/first_ten_Sample_HV_Clip.wav"
          reference_original="$RUNNER_TEMP/first_ten_Sample_HV_Clip_ground_truth.rttm"
          curl --fail --location --retry 3 --silent --show-error \
            --output "$wav_archive" \
            "$upstream/sample_files/short_wav/first_ten_Sample_HV_Clip.wav"
          curl --fail --location --retry 3 --silent --show-error \
            --output "$reference_original" \
            "$upstream/ground_truth_files/first_ten_Sample_HV_Clip%20ground_truth.rttm"
          # Git blob hashes from the pinned upstream tree; verify both exact assets.
          test "$(git hash-object "$wav_archive")" = e40c1201ef51fcae123fd94c37ba1f837f0b6728
          test "$(git hash-object "$reference_original")" = 4b19562e4ad6ed70d0bdbc6f0eb657809fb39107
          git hash-object "$wav_archive" "$reference_original" \
            | tee "$root/upstream-blob-hashes.txt"
          # The upstream RTTM recording ID is 'waveform'. Normalize only the ID
          # to the pinned WAV basename, never its human-labeled boundaries.
          python3 - "$reference_original" "$root/reference/first_ten_Sample_HV_Clip.rttm" <<'PY'
          from pathlib import Path
          import sys
          original, output = map(Path, sys.argv[1:3])
          converted = []
          for line in original.read_text(encoding="utf-8").splitlines():
              if not line.strip():
                  continue
              fields = line.split()
              if len(fields) != 10 or fields[0] != "SPEAKER" or fields[1] != "waveform":
                  raise SystemExit(f"Unexpected independently labeled RTTM: {line!r}")
              fields[1] = "first_ten_Sample_HV_Clip"
              converted.append(" ".join(fields))
          if len(converted) < 2:
              raise SystemExit("Missing ground-truth speaker boundaries")
          output.write_text("\n".join(converted) + "\n", encoding="utf-8")
          PY
          ffmpeg -hide_banner -loglevel error -y \
            -i "$wav_archive" -ac 1 -ar 16000 -c:a pcm_s16le \
            "$root/wav/first_ten_Sample_HV_Clip.wav"
          test -s "$root/wav/first_ten_Sample_HV_Clip.wav"
      - name: Compute independent real-model diarization DER diagnostic
        run: |
          ctest --test-dir build-sherpa \
            -R '^speech_real_speaker_diarization_reference_der$' \
            --output-on-failure --no-tests=error
          cat build-sherpa/audio-fixtures/diarization-reference/der.json
      - name: Download official Sherpa GTCRN denoising ONNX
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --silent --show-error \
            --output build-sherpa/gtcrn_simple.onnx \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/speech-enhancement-models/gtcrn_simple.onnx
          echo 'e77603ac0c23dac3227dd2d7135b3a585cbee2679048aecfa886657d3ae1b534  build-sherpa/gtcrn_simple.onnx' | sha256sum --check
          sha256sum build-sherpa/gtcrn_simple.onnx | tee build-sherpa/audio-fixtures/gtcrn-model.sha256
      - name: Validate offline and streaming GTCRN ONNX enhancement via CTest
        run: |
          ctest --test-dir build-sherpa -R '^speech_real_gtcrn_denoising$' --output-on-failure --no-tests=error
          cat build-sherpa/audio-fixtures/gtcrn-report.txt
      - name: Real Silero VAD + SenseVoice ASR WAV replay and quality scoring
        run: |
          ctest --test-dir build-sherpa -R '^speech_(real_silero_sensevoice_wav|real_sensevoice_quality|report_scoring_selftest)$' --output-on-failure
          cat build-sherpa/audio-fixtures/real-speech-report.txt
      - name: Upload model-audio diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-speech-model-integration
          path: |
            build-sherpa/audio-fixtures/real-speech-report.txt
            build-sherpa/audio-fixtures/asr-quality.json
            build-sherpa/audio-fixtures/gtcrn-report.txt
            build-sherpa/audio-fixtures/gtcrn-model.sha256
            build-sherpa/kws-archive.sha256
            build-sherpa/audio-fixtures/streaming-asr-model.sha256
            build-sherpa/audio-fixtures/streaming-asr-report.txt
            build-sherpa/audio-fixtures/language-id-report.txt
            build-sherpa/audio-fixtures/language-id-assets.sha256
            build-sherpa/audio-fixtures/speaker-diarization-report.txt
            build-sherpa/audio-fixtures/speaker-diarization-report.rttm
            build-sherpa/audio-fixtures/diarization-benchmark.txt
            build-sherpa/audio-fixtures/diarization-benchmark.rttm
            build-sherpa/audio-fixtures/diarization-assets.sha256
            build-sherpa/audio-fixtures/diarization-reference/der.json
            build-sherpa/audio-fixtures/diarization-reference/reference/*.rttm
            build-sherpa/audio-fixtures/diarization-reference/predicted/*.rttm
            build-sherpa/audio-fixtures/diarization-reference/upstream-blob-hashes.txt
          if-no-files-found: ignore
          retention-days: 14
      - name: Install
        run: cmake --install build-sherpa --prefix "$PWD/install-sherpa"
      - name: Verify installed Sherpa and core C++17 consumers through CTest
        run: ctest --test-dir build-sherpa -R '^installed_package_.*consumer$' --output-on-failure

  sherpa-tts-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt 5 Widgets
        run: |
          sudo apt-get update
          sudo apt-get install -y qtbase5-dev
      - name: Configure sherpa-onnx TTS backend
        run: >-
          cmake -S . -B build-sherpa-tts -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DLIBAUDITION_WITH_SHERPA=ON
          -DLIBAUDITION_SHERPA_ENABLE_TTS=ON
          -DLIBAUDITION_WITH_SPDLOG=OFF
          -DLIBAUDITION_BUILD_TESTS=ON
          -DLIBAUDITION_REGISTER_REAL_QT_MODEL_TESTS=ON
          -DLIBAUDITION_BUILD_EXAMPLES=ON
          -DLIBAUDITION_BUILD_QT_DEMO=ON
          -DLIBAUDITION_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build-sherpa-tts --parallel 2
      - name: Headless Qt workbench self-test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build-sherpa-tts -R '^qt_self_test$' --output-on-failure
      - name: Test asynchronous Sherpa GUI error and restart paths
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build-sherpa-tts -R '^qt_sherpa_errors$' --output-on-failure
      - name: Test
        run: ctest --test-dir build-sherpa-tts -LE real-model --output-on-failure
      - name: Download pinned Piper Amy Low INT8 fixture
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output build-sherpa-tts/piper-amy-low-int8.tar.bz2 \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-en_US-amy-low-int8.tar.bz2
          echo "93070ac9fadf512e56c46bdd0c5d2ce96b424fdc4e683d560167410bd2c4df7d  build-sherpa-tts/piper-amy-low-int8.tar.bz2" | sha256sum --check
          tar -xjf build-sherpa-tts/piper-amy-low-int8.tar.bz2 -C build-sherpa-tts
          test -d build-sherpa-tts/vits-piper-en_US-amy-low-int8/espeak-ng-data
          test -s build-sherpa-tts/vits-piper-en_US-amy-low-int8/tokens.txt
      - name: Test actual Piper VITS synthesis and WAV export via Qt
        env:
          QT_QPA_PLATFORM: offscreen
          LIBAUDITION_TEST_PIPER_DIR: ${{ github.workspace }}/build-sherpa-tts/vits-piper-en_US-amy-low-int8
        run: ctest --test-dir build-sherpa-tts -R '^qt_real_piper-real$' --output-on-failure
      - name: Install
        run: cmake --install build-sherpa-tts --prefix "$PWD/install-sherpa-tts"
      - name: Verify installed sherpa TTS package from C++17 consumer
        shell: bash
        run: |
          mkdir -p /tmp/libaudition-sherpa-tts-consumer
          cat > /tmp/libaudition-sherpa-tts-consumer/CMakeLists.txt <<'CMAKE'
          cmake_minimum_required(VERSION 3.20)
          project(libaudition_sherpa_tts_consumer LANGUAGES CXX)
          find_package(libaudition CONFIG REQUIRED)
          add_executable(consumer main.cpp)
          target_link_libraries(consumer PRIVATE audition::backend_sherpa)
          target_compile_features(consumer PRIVATE cxx_std_17)
          CMAKE
          cat > /tmp/libaudition-sherpa-tts-consumer/main.cpp <<'CPP'
          #include <audition/backends/sherpa.hpp>
          #include <type_traits>

          #if !defined(LIBAUDITION_SHERPA_TTS_ENABLED)
          #error "Installed sherpa target must propagate TTS support"
          #endif

          int main() {
              audition::SherpaTtsOptions options{};
              auto& model = std::get<audition::SherpaTtsVitsModel>(options.model);
              model.model = "voice.onnx";
              model.tokens = "tokens.txt";
              model.data_dir = "espeak-ng-data";
              options.languages = {"en"};
              audition::validateSherpaTtsOptions(options);
              static_assert(std::is_base_of_v<audition::ISpeechSynthesizer,
                                              audition::SherpaTts>);
              return 0;
          }
          CPP
          cmake -S /tmp/libaudition-sherpa-tts-consumer \
            -B /tmp/libaudition-sherpa-tts-consumer/build -G Ninja \
            -DCMAKE_PREFIX_PATH="$PWD/install-sherpa-tts"
          cmake --build /tmp/libaudition-sherpa-tts-consumer/build --parallel
          LD_LIBRARY_PATH="$PWD/install-sherpa-tts/lib:${LD_LIBRARY_PATH:-}" \
            /tmp/libaudition-sherpa-tts-consumer/build/consumer

  clap-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt 5 Widgets
        run: |
          sudo apt-get update
          sudo apt-get install -y qtbase5-dev
      - name: Configure CLAP ONNX backend
        run: >-
          cmake -S . -B build-clap -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DLIBAUDITION_WITH_CLAP=ON
          -DLIBAUDITION_WITH_SPDLOG=OFF
          -DLIBAUDITION_BUILD_TESTS=ON
          -DLIBAUDITION_REGISTER_REAL_QT_MODEL_TESTS=ON
