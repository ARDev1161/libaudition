name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Check Ninja
        run: ninja --version
      - name: Configure
        run: cmake --preset ci
      - name: Build
        run: cmake --build --preset ci --parallel
      - name: Test
        run: ctest --preset ci


  cpp-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install coverage reporter
        run: |
          python3 -m venv "$RUNNER_TEMP/gcovr"
          "$RUNNER_TEMP/gcovr/bin/pip" install "gcovr==8.4"
      - name: Configure instrumented core and tests
        run: >-
          cmake -S . -B build-coverage -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_SHARED_LIBS=OFF
          -DLIBAUDITION_WITH_SPDLOG=OFF
          -DLIBAUDITION_BUILD_TESTS=ON
          -DLIBAUDITION_BUILD_EXAMPLES=ON
          -DLIBAUDITION_BUILD_QT_DEMO=OFF
          -DLIBAUDITION_WARNINGS_AS_ERRORS=ON
          -DCMAKE_CXX_FLAGS=--coverage
          -DCMAKE_EXE_LINKER_FLAGS=--coverage
      - name: Build instrumented targets
        run: cmake --build build-coverage --parallel 2
      - name: Run entire instrumented CTest suite
        run: ctest --test-dir build-coverage --output-on-failure --parallel 2 --no-tests=error
      - name: Report library-only C++ line and branch coverage
        run: |
          mkdir -p build-coverage/reports
          "$RUNNER_TEMP/gcovr/bin/gcovr" build-coverage \
            --root . --filter 'src/' --exclude-unreachable-branches \
            --txt build-coverage/reports/coverage.txt \
            --json-summary build-coverage/reports/coverage-summary.json \
            --xml-pretty build-coverage/reports/cobertura.xml \
            --html-details build-coverage/reports/coverage.html
          cat build-coverage/reports/coverage.txt
      - name: Upload C++ coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: libaudition-cpp-core-coverage
          path: build-coverage/reports/
          if-no-files-found: warn
          retention-days: 14

  minimal-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Ninja
        run: ninja --version
      - name: Configure without optional dependencies
        run: cmake --preset minimal
      - name: Build
        run: cmake --build --preset minimal --parallel


  efficientat-real-weights:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install exporter dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/efficientat-real"
          "$RUNNER_TEMP/efficientat-real/bin/pip" install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          "$RUNNER_TEMP/efficientat-real/bin/pip" install onnx onnxruntime numpy
          "$RUNNER_TEMP/efficientat-real/bin/pip" install torchaudio --index-url https://download.pytorch.org/whl/cpu
      - name: Configure real EfficientAT backend test
        run: >-
          cmake -S . -B build-efficientat-real -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DLIBAUDITION_WITH_EFFICIENTAT=ON
          -DLIBAUDITION_WITH_YAMNET=ON
          -DLIBAUDITION_WITH_SPDLOG=OFF
          -DLIBAUDITION_BUILD_TESTS=ON
          -DLIBAUDITION_REGISTER_MODEL_TOOL_TESTS=ON
          -DPython3_EXECUTABLE=$RUNNER_TEMP/efficientat-real/bin/python
          -DLIBAUDITION_BUILD_EXAMPLES=OFF
          -DLIBAUDITION_WARNINGS_AS_ERRORS=ON
      - name: Build C++ real-model smoke tool
        run: cmake --build build-efficientat-real --target libaudition_tests efficientat_real_model_smoke efficientat_frontend_dump efficientat_wav_benchmark yamnet_wav_benchmark yamnet_pcm16_probe yamnet_progressive_smoke yamnet_progressive_multisource real_yamnet_wav_replay --parallel
      - name: Audit all configured algorithm CTest registrations
        run: ctest --test-dir build-efficientat-real -R '^algorithm_coverage_contract$' --output-on-failure
      - name: Upload CTest algorithm coverage inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: efficientat-algorithm-ctest-contract
          path: build-efficientat-real/ctest-algorithm-coverage.json
          if-no-files-found: warn
          retention-days: 14
      - name: Fetch original EfficientAT source
        run: |
          git clone --depth 1 https://github.com/fschmid56/EfficientAT.git "$RUNNER_TEMP/EfficientAT"
          git -C "$RUNNER_TEMP/EfficientAT" rev-parse HEAD | tee "$RUNNER_TEMP/efficientat-upstream-sha.txt"
      - name: Audit actual EfficientAT and YAMNet AudioSet vocabularies
        run: |
          curl --fail --location --retry 3 --silent --show-error \
            "https://huggingface.co/audiomagic/yamnet-onnx/resolve/f25b741/yamnet_class_map.csv" \
            --output "$RUNNER_TEMP/yamnet_class_map.csv"
          ctest --test-dir build-efficientat-real -R '^real_audioset_vocabulary_audit$' --output-on-failure
      - name: Export genuine mn10_as and dymn10_as weights and compare ONNX logits
        run: |
          cd "$RUNNER_TEMP/EfficientAT"
          export PYTHONPATH="$RUNNER_TEMP/EfficientAT"
          "$RUNNER_TEMP/efficientat-real/bin/python" "$GITHUB_WORKSPACE/tools/export_efficientat.py" --model mn10_as --output "$RUNNER_TEMP/eat-real"
          "$RUNNER_TEMP/efficientat-real/bin/python" "$GITHUB_WORKSPACE/tools/export_efficientat.py" --model dymn10_as --output "$RUNNER_TEMP/eat-real"
      - name: CTest classifier smoke against genuine weights
        run: ctest --test-dir build-efficientat-real -R '^real_efficientat_(mn10_as|dymn10_as)$' --output-on-failure
      - name: Run model-tool validation suite via CTest
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          export PATH="$RUNNER_TEMP/efficientat-real/bin:$PATH"
          ctest --test-dir build-efficientat-real -L model-tools --output-on-failure --parallel 2
      - name: Fetch pinned YAMNet ONNX demo model and labels
        run: |
          mkdir -p "$RUNNER_TEMP/yamnet"
          for file in yamnet.onnx yamnet_class_map.csv; do
            curl --fail --location --retry 3 --silent --show-error \
              "https://huggingface.co/audiomagic/yamnet-onnx/resolve/f25b741/$file" \
              --output "$RUNNER_TEMP/yamnet/$file"
          done
      - name: Validate YAMNet C++/ONNX parity and malformed label maps through CTest
        run: ctest --test-dir build-efficientat-real -R '^real_yamnet_(onnx_cpp_parity_(short|long)|label_rejection)$' --output-on-failure --parallel 2
      - name: Real YAMNet quick/refined WAV replay (not raw mock PCM)
        run: |
          ctest --test-dir build-efficientat-real -R '^real_yamnet_wav_replay_ctest$' --output-on-failure
          cat "$RUNNER_TEMP/yamnet-real-wav-report.txt"
      - name: Real-weight YAMNet fast-to-refined CTest integration
        run: ctest --test-dir build-efficientat-real -R '^real_yamnet_progressive_smoke$' --output-on-failure
      - name: Stream 5 and 10 ODAS-like sources through real YAMNet
        run: ctest --test-dir build-efficientat-real -L stress --output-on-failure --parallel 2
      - name: Upload real YAMNet multi-source latency and drop reports
        uses: actions/upload-artifact@v4
        with:
          name: yamnet-progressive-multisource-stress
          path: |
            ${{ runner.temp }}/yamnet-stream-5.json
            ${{ runner.temp }}/yamnet-stream-10.json
          retention-days: 14
      - name: Verify official YAMNet silence noise and sine wave behavior
        run: ctest --test-dir build-efficientat-real -R '^real_yamnet_behavior$' --output-on-failure
      - name: Generate deterministic WAV and run genuine classifier benchmarks via CTest
        run: ctest --test-dir build-efficientat-real -R '^real_(efficientat_wav_benchmark_(mn10_as|dymn10_as)|yamnet_wav_benchmark)$' --output-on-failure --parallel 2
      - name: Compare all three real models on shared AudioSet ontology via CTest
        run: ctest --test-dir build-efficientat-real -R '^real_audioset_smoke_comparison$' --output-on-failure
      - name: Install audio conversion tool for ESC-10 evaluation
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Run full attributed ESC-10 real-model acceptance suite via CTest
        run: ctest --test-dir build-efficientat-real -R '^real_esc10_' --output-on-failure --parallel 1
      - name: Upload expanded ESC-10 YAMNet evaluation and licensing
        uses: actions/upload-artifact@v4
        with:
          name: yamnet-esc10-80-evaluation
          path: |
            ${{ runner.temp }}/esc10-yamnet-extended/yamnet-esc10-80.json
            ${{ runner.temp }}/esc10-yamnet-extended/manifest.csv
            ${{ runner.temp }}/esc10-yamnet-extended/provenance.csv
            ${{ runner.temp }}/esc10-yamnet-extended/ESC-50-LICENSE.txt
          retention-days: 14
      - name: Upload real-event comparison and source attribution
        uses: actions/upload-artifact@v4
        with:
          name: efficientat-yamnet-esc10-real-event-report
          path: |
            ${{ runner.temp }}/esc10-eval/three-model-real-events.json
            ${{ runner.temp }}/yamnet-onnx-cpp-parity.json
            ${{ runner.temp }}/yamnet-onnx-cpp-5s-parity.json
            ${{ runner.temp }}/esc10-eval/yamnet-event-timeline.json
            ${{ runner.temp }}/yamnet-behavior.json
            ${{ runner.temp }}/esc10-eval/review-findings.json
            ${{ runner.temp }}/esc10-eval/mn10-chainsaw-parity.json
            ${{ runner.temp }}/esc10-eval/mn10-duration.json
            ${{ runner.temp }}/esc10-eval/manifest.csv
            ${{ runner.temp }}/esc10-eval/provenance.csv
            ${{ runner.temp }}/esc10-eval/ESC-50-LICENSE.txt
          retention-days: 14
      - name: Upload three-model smoke comparison
        uses: actions/upload-artifact@v4
        with:
          name: efficientat-yamnet-smoke-report
          path: ${{ runner.temp }}/three-model-comparison.json
          retention-days: 14

  efficientat-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt Widgets
        run: sudo apt-get update && sudo apt-get install -y qtbase5-dev
      - name: Install reference model-test Python dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/efficientat-parity"
          "$RUNNER_TEMP/efficientat-parity/bin/pip" install numpy onnx
          "$RUNNER_TEMP/efficientat-parity/bin/pip" install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
      - name: Configure EfficientAT ONNX adapter
        run: >-
          cmake -S . -B build-efficientat -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DLIBAUDITION_WITH_EFFICIENTAT=ON
          -DLIBAUDITION_REGISTER_EFFICIENTAT_REFERENCE_TESTS=ON
          -DPython3_EXECUTABLE=$RUNNER_TEMP/efficientat-parity/bin/python
          -DLIBAUDITION_BUILD_QT_DEMO=ON
          -DLIBAUDITION_WITH_YAMNET=OFF
          -DLIBAUDITION_DEMO_FETCH_YAMNET_MODEL=OFF
          -DLIBAUDITION_WITH_SPDLOG=OFF
          -DLIBAUDITION_BUILD_TESTS=ON
          -DLIBAUDITION_BUILD_EXAMPLES=OFF
          -DLIBAUDITION_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build-efficientat --parallel
      - name: Run all EfficientAT checks via CTest (incl. ONNX fixture and PyTorch parity)
        env:
          LIBAUDITION_EFFICIENTAT_FIXTURE_DIR: ${{ github.workspace }}/build-efficientat/fixture
        run: ctest --test-dir build-efficientat --output-on-failure --parallel 2 --no-tests=error
      - name: Install
        run: cmake --install build-efficientat --prefix "$PWD/install-efficientat"

  installed-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure dependency-free install
        run: >-
          cmake -S . -B build-install -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DLIBAUDITION_WITH_SPDLOG=OFF
          -DLIBAUDITION_BUILD_TESTS=OFF
          -DLIBAUDITION_REGISTER_INSTALLED_PACKAGE_SMOKE=ON
          -DLIBAUDITION_PACKAGE_SMOKE_PREFIX=$PWD/install-default
          -DLIBAUDITION_BUILD_EXAMPLES=OFF
          -DLIBAUDITION_FETCH_DEPENDENCIES=OFF
          -DLIBAUDITION_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build-install --parallel
      - name: Install
        run: cmake --install build-install --prefix "$PWD/install-default"
      - name: Verify installed C++17 consumer through CTest
        run: ctest --test-dir build-install -R '^installed_package_cpp17_consumer$' --output-on-failure --no-tests=error

  sanitizers:
    runs-on: ubuntu-latest
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
      - name: Configure ASan + UBSan
        run: >-
          cmake -S . -B build-sanitizers -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_SHARED_LIBS=OFF
          -DLIBAUDITION_WITH_SPDLOG=OFF
          -DLIBAUDITION_BUILD_TESTS=ON
          -DLIBAUDITION_BUILD_EXAMPLES=ON
          -DLIBAUDITION_WARNINGS_AS_ERRORS=ON
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build-sanitizers --parallel
      - name: Test under sanitizers
        run: ctest --test-dir build-sanitizers --output-on-failure

  qt-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt 5 Widgets and Multimedia
        run: |
          sudo apt-get update
          sudo apt-get install -y qtbase5-dev qtmultimedia5-dev libqt5multimedia5-plugins gstreamer1.0-plugins-good
      - name: Configure Qt playground
        run: >-
          cmake -S . -B build-qt-demo -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DLIBAUDITION_WITH_SPDLOG=OFF
          -DLIBAUDITION_BUILD_TESTS=OFF
          -DLIBAUDITION_BUILD_EXAMPLES=OFF
          -DLIBAUDITION_BUILD_QT_DEMO=ON
          -DLIBAUDITION_WARNINGS_AS_ERRORS=ON
      - name: Build Qt playground
        run: cmake --build build-qt-demo --parallel
      - name: Headless Qt playground self-test
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ctest --test-dir build-qt-demo -R '^qt_self_test$' --output-on-failure
          ctest --test-dir build-qt-demo -R '^qt_playback_lifecycle$' --output-on-failure

  qt6-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt 6 Widgets and Multimedia
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build qt6-base-dev qt6-multimedia-dev
      - name: Configure Qt 6 playground
        run: >-
          cmake -S . -B build-qt6-demo -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DLIBAUDITION_WITH_SPDLOG=OFF
          -DLIBAUDITION_WITH_YAMNET=OFF
          -DLIBAUDITION_DEMO_FETCH_YAMNET_MODEL=OFF
          -DLIBAUDITION_DEMO_FETCH_SPEECH_MODELS=OFF
          -DLIBAUDITION_BUILD_TESTS=OFF
          -DLIBAUDITION_BUILD_EXAMPLES=OFF
          -DLIBAUDITION_BUILD_QT_DEMO=ON
          -DLIBAUDITION_WARNINGS_AS_ERRORS=ON
      - name: Build Qt 6 playground
        run: cmake --build build-qt6-demo --parallel 2
      - name: Headless Qt 6 playground self-test
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ctest --test-dir build-qt6-demo -R '^qt_self_test$' --output-on-failure
          ctest --test-dir build-qt6-demo -R '^qt_playback_lifecycle$' --output-on-failure

  qt6-gcc16-sherpa-arch:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Install Arch toolchain, Qt 6 Multimedia and backend prerequisites
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel gcc git cmake ninja pkgconf curl python \
            qt6-base qt6-multimedia alsa-lib fftw libconfig libpulse
          g++ --version
          pacman -Q gcc qt6-base qt6-multimedia
          test "$(g++ -dumpfullversion | cut -d. -f1)" -ge 16
      - uses: actions/checkout@v4
      - name: Configure GCC 16 with Qt 6, Multimedia, ODAS, Sherpa and YAMNet
        run: >-
          cmake -S . -B build-arch-qt6 -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_CXX_COMPILER=g++
          -DLIBAUDITION_WITH_SPDLOG=OFF
          -DLIBAUDITION_WITH_ODAS=ON
          -DLIBAUDITION_WITH_SHERPA=ON
          -DLIBAUDITION_WITH_YAMNET=ON
          -DLIBAUDITION_DEMO_FETCH_YAMNET_MODEL=OFF
          -DLIBAUDITION_DEMO_FETCH_SPEECH_MODELS=OFF
          -DLIBAUDITION_BUILD_TESTS=ON
          -DLIBAUDITION_BUILD_EXAMPLES=OFF
          -DLIBAUDITION_BUILD_QT_DEMO=ON
          -DLIBAUDITION_WARNINGS_AS_ERRORS=ON
      - name: Assert Qt 6 Multimedia and ALSA enabled
        run: |
          grep -Fq -- '-DLIBAUDITION_DEMO_HAS_MULTIMEDIA=1' build-arch-qt6/compile_commands.json
          grep -Fq -- '-DLIBAUDITION_DEMO_HAS_ALSA=1' build-arch-qt6/compile_commands.json
      - name: Build all targets with GCC 16 and Werror
        run: cmake --build build-arch-qt6 --parallel 2
      - name: Run all C++ tests
        run: ctest --test-dir build-arch-qt6 --output-on-failure --parallel 2
      - name: Run Qt 6 integrated smoke and lifecycle fixtures
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ctest --test-dir build-arch-qt6 -R '^qt_self_test$' --output-on-failure
          ctest --test-dir build-arch-qt6 -R '^qt_source_track_lifecycle$' --output-on-failure
          ctest --test-dir build-arch-qt6 -R '^qt_playback_lifecycle$' --output-on-failure
          ctest --test-dir build-arch-qt6 -R '^qt_live_source_tagging_errors$' --output-on-failure

  audio-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install audio backend build requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libfftw3-dev libasound2-dev libconfig-dev libpulse-dev python3
      - name: Configure standalone ODAS integration suite
        run: >-
          cmake -S . -B build-audio-integration -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DLIBAUDITION_WITH_ODAS=ON
          -DLIBAUDITION_WITH_YAMNET=OFF
          -DLIBAUDITION_WITH_SPDLOG=OFF
          -DLIBAUDITION_BUILD_TESTS=ON
          -DLIBAUDITION_BUILD_EXAMPLES=OFF
          -DLIBAUDITION_BUILD_QT_DEMO=OFF
          -DLIBAUDITION_WARNINGS_AS_ERRORS=ON
      - name: Build real offline ODAS/SSS runner
        run: cmake --build build-audio-integration --target audition_offline_integration --parallel 2
      - name: Replay synthetic spatial WAV and validate ground truth
        run: ctest --test-dir build-audio-integration -L audio-integration --output-on-failure --parallel 2 --no-tests=error
      - name: Upload audio traces, ground truth and recordings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audio-integration-results
          path: |
            build-audio-integration/tests/spatial_audio_fixtures/ground_truth.json
            build-audio-integration/tests/audio_integration_results/
          if-no-files-found: warn
          retention-days: 14

  odas-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ODAS build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libfftw3-dev libasound2-dev libconfig-dev libpulse-dev qtbase5-dev
      - name: Use pinned CMake 4 for ODAS compatibility coverage
        run: |
          python3 -m venv "$RUNNER_TEMP/cmake4"
          "$RUNNER_TEMP/cmake4/bin/python" -m pip install "cmake==4.1.2"
          echo "$RUNNER_TEMP/cmake4/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/cmake4/bin/cmake" --version
      - name: Configure with direct ODAS backend
        run: >-
          cmake -S . -B build-odas -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DLIBAUDITION_WITH_ODAS=ON
          -DLIBAUDITION_WITH_SPDLOG=OFF
          -DLIBAUDITION_BUILD_TESTS=ON
          -DLIBAUDITION_BUILD_EXAMPLES=ON
          -DLIBAUDITION_BUILD_QT_DEMO=ON
          -DLIBAUDITION_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build-odas --parallel
      - name: Headless Qt workbench self-test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build-odas -R '^qt_self_test$' --output-on-failure
      - name: Qt async odas-errors smoke test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build-odas -R '^qt_odas_errors$' --output-on-failure
      - name: Test ALSA live capture device-open failure and restart
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build-odas -R '^qt_alsa_errors$' --output-on-failure
      - name: Test
        run: ctest --test-dir build-odas --output-on-failure
      - name: Install
        run: cmake --install build-odas --prefix "$PWD/install-odas"
      - name: Verify installed ODAS backend package
        shell: bash
        run: |
          mkdir -p /tmp/libaudition-odas-consumer
          cat > /tmp/libaudition-odas-consumer/CMakeLists.txt <<'CMAKE'
          cmake_minimum_required(VERSION 3.20)
          project(libaudition_odas_consumer LANGUAGES CXX)
          find_package(libaudition CONFIG REQUIRED)
          add_executable(consumer main.cpp)
          target_link_libraries(consumer PRIVATE audition::backend_odas)
          target_compile_features(consumer PRIVATE cxx_std_17)
          CMAKE
          cat > /tmp/libaudition-odas-consumer/main.cpp <<'CPP'
          #include <audition/backends/odas.hpp>
          int main() {
              audition::OdasOptions options{};
              return options.sample_rate_hz == 16000U ? 0 : 1;
          }
          CPP
          cmake -S /tmp/libaudition-odas-consumer -B /tmp/libaudition-odas-consumer/build -G Ninja             -DCMAKE_PREFIX_PATH="$PWD/install-odas"
          cmake --build /tmp/libaudition-odas-consumer/build --parallel


  samplerate-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt 5 Widgets
        run: |
          sudo apt-get update
          sudo apt-get install -y qtbase5-dev
      - name: Configure libsamplerate backend
        run: >-
          cmake -S . -B build-samplerate -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DLIBAUDITION_WITH_LIBSAMPLERATE=ON
          -DLIBAUDITION_WITH_SPDLOG=OFF
          -DLIBAUDITION_BUILD_TESTS=ON
          -DLIBAUDITION_BUILD_EXAMPLES=ON
          -DLIBAUDITION_BUILD_QT_DEMO=ON
          -DLIBAUDITION_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build-samplerate --parallel
      - name: Headless Qt workbench self-test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build-samplerate -R '^qt_self_test$' --output-on-failure
      - name: Qt async samplerate functional smoke test
        env:
          QT_QPA_PLATFORM: offscreen
