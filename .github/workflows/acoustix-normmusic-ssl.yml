name: Acoustix experimental NormMUSIC SSL contract

on:
  pull_request:
    paths:
      - 'tests/integration/acoustix_normmusic_probe.py'
      - 'tests/integration/test_acoustix_normmusic_probe.py'
      - 'tests/integration/acoustix_ssl_oracle_score.py'
      - 'tests/integration/test_acoustix_ssl_oracle_score.py'
      - '.github/workflows/acoustix-normmusic-ssl.yml'
  workflow_dispatch:

jobs:
  normmusic-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numeric backend
        run: python -m pip install 'numpy==2.1.3'
      - name: Run deterministic steering and PCM contract tests
        run: |
          python -m unittest discover -s tests/integration -p test_acoustix_normmusic_probe.py -v
          python -m unittest discover -s tests/integration -p test_acoustix_ssl_oracle_score.py -v
