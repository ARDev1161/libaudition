name: ODAS fork pinned-SHA integration

on:
  pull_request:
    branches: [main]
    paths:
      - 'cmake/Dependencies.cmake'
      - '.github/workflows/odas-fork-pin-integration.yml'
      - 'docs/ODAS_FORK_PIN.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  odas-fork:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install native ODAS build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libfftw3-dev libasound2-dev libconfig-dev libpulse-dev libopenblas-dev
      - name: Verify immutable fork pin, never moving dev
        run: |
          grep -F 'GIT_REPOSITORY https://github.com/ARDev1161/odas.git' cmake/Dependencies.cmake
          grep -F 'GIT_TAG 1d862592fa69c8e789743e71160e9e26ff38ebfc' cmake/Dependencies.cmake
      - name: Configure libaudition with actual fork backend
        run: |
          cmake -S . -B build-odas-pin -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLIBAUDITION_WITH_ODAS=ON \
            -DLIBAUDITION_BUILD_TESTS=ON \
            -DLIBAUDITION_BUILD_EXAMPLES=OFF \
            -DLIBAUDITION_BUILD_QT_DEMO=OFF \
            -DLIBAUDITION_WITH_SPDLOG=OFF \
            -DLIBAUDITION_WARNINGS_AS_ERRORS=ON
      - name: Build real ODAS and libaudition tests + offline consumer
        run: |
          cmake --build build-odas-pin \
            --target libaudition_tests audition_offline_integration --parallel 2
      - name: Run ODAS-backed C++ tests (not hardware acceptance)
        run: |
          ctest --test-dir build-odas-pin \
            -R '^(OdasOptions|OdasBackend)\.' \
            --output-on-failure --no-tests=error --timeout 120
