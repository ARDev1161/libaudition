name: Documentation site

# The documentation website lives entirely on the dedicated documentation branch.
# The main branch has a small optional sync/deploy bridge for automatic refreshes;
# direct documentation pushes still build and deploy with this workflow.
on:
  push:
    branches: [documentation]

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Sphinx + Doxygen docs
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz
          python -m pip install -r docs/requirements.txt
      - name: Check Mermaid viewer JavaScript syntax and gestures
        run: |
          node --check docs/_static/diagram-viewer.js
          node --test docs/tests/diagram-viewer.test.cjs
      - name: Extract public-header XML for Sphinx
        run: doxygen docs/Doxyfile.public
      - name: Build full Doxygen HTML, XML and Graphviz graphs
        run: doxygen docs/Doxyfile.pages
      - name: Validate architecture links and Graphviz output
        run: |
          python3 docs/doxygen_links.py --check
          find docs/_build/doxygen -name '*.svg' -print -quit | grep -q .
      - name: Build Sphinx and bundle standalone Doxygen HTML
        run: |
          sphinx-build -b html --keep-going docs docs/_build/html
          test -s docs/_build/doxygen/index.html
          cp -a docs/_build/doxygen docs/_build/html/doxygen
      - name: Verify public API version is displayed
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import runpy
          release = runpy.run_path("docs/conf.py")["release"]
          html = Path("docs/_build/html/index.html").read_text(encoding="utf-8")
          import re
          from html import unescape

          # Furo is free to insert whitespace or other markup between its
          # title span and our version span; verify content and ordering
          # inside the same sidebar brand instead of matching adjacent tags.
          brands = re.findall(
              r'<a\b[^>]*class="[^"]*\bsidebar-brand\b[^"]*"[^>]*>.*?</a>',
              html,
              flags=re.S,
          )
          expected = f"v{release}"
          assert brands, "Furo sidebar brand is missing"
          for brand in brands:
              title_match = re.search(
                  r'<span\b[^>]*class="[^"]*\bsidebar-brand-text\b[^"]*"[^>]*>(.*?)</span>',
                  brand,
                  flags=re.S,
              )
              version_match = re.search(
                  r'<span\b[^>]*class="[^"]*\bsidebar-brand-version\b[^"]*"[^>]*>(.*?)</span>',
                  brand,
                  flags=re.S,
              )
              if not title_match or not version_match:
                  print("Unexpected Furo sidebar markup:", brand[:1500])
              assert title_match and version_match, "Sidebar title or version missing"
              assert unescape(title_match.group(1)).strip() == "libaudition documentation"
              assert unescape(version_match.group(1)).strip() == expected
              assert title_match.end() < version_match.start(), "Version must follow title"
          assert 'layout.css' in html, "Sidebar version styling must be loaded"
          print(f"Verified documentation version: v{release}")
          PY
      - name: Verify Doxygen HTML reference is published
        run: |
          test -s docs/_build/html/doxygen/index.html
          test -s docs/_build/html/doxygen/classes.html
          grep -q 'Doxygen HTML API' docs/_build/html/index.html
          grep -q 'doxygen/index.html' docs/_build/html/index.html
      - name: Verify interactive viewer is bundled
        run: |
          test -s docs/_build/html/_static/diagram-viewer.js
          test -s docs/_build/html/_static/diagram-viewer.css
          test -s docs/_build/html/_static/layout.css
          grep -q 'layout.css' docs/_build/html/index.html
          grep -q 'layout.css' docs/_build/html/functional_architecture.html
          grep -q 'diagram-viewer.js' docs/_build/html/functional_architecture.html
          grep -q 'diagram-viewer.js' docs/_build/html/index.html
          # The landing-page block must be parsed as a Mermaid directive,
          # not a syntax-highlighted text fence with no interactive SVG.
          grep -Eq '(mermaid-diagram|class="mermaid")' docs/_build/html/index.html
          # Guard source-linked nodes and the trusted Mermaid link setting.
          grep -q 'click ODAS' docs/_build/html/index.html
          grep -Eq 'click ODAS.*doxygen/.*\.html' docs/_build/html/index.html
          # Older sphinxcontrib-mermaid releases inject the config into HTML/JS
          # instead of generating _static/sphinxcontrib-mermaid/config.json.
          # Verify the authoritative Sphinx config without assuming asset layout.
          python3 - <<'PY'
          import runpy
          settings = runpy.run_path("docs/conf.py")
          assert settings["mermaid_config"]["securityLevel"] == "loose"
          PY
      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/documentation'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    name: Publish to GitHub Pages
    if: github.ref == 'refs/heads/documentation'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
