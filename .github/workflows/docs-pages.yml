name: Documentation site

# The documentation website lives entirely on the dedicated documentation branch.
# The main branch has a small optional sync/deploy bridge for automatic refreshes;
# direct documentation pushes still build and deploy with this workflow.
on:
  push:
    branches: [documentation]

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Sphinx + Doxygen docs
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen
          python -m pip install -r docs/requirements.txt
      - name: Extract C++ API from public headers
        run: doxygen docs/Doxyfile.pages
      - name: Build HTML site
        run: sphinx-build -b html --keep-going docs docs/_build/html
      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/documentation'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    name: Publish to GitHub Pages
    if: github.ref == 'refs/heads/documentation'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
