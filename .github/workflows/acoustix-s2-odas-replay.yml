name: Acoustix S2 real-speech ODAS replay (opt-in)

# Replay the EXACT already-rendered/validated real human speech WAV artifact:
# never regenerate RIRs between baseline and downstream ODAS comparisons.
on:
  pull_request:
    types: [ready_for_review]
  workflow_dispatch:
    inputs:
      speech_artifact_run_id:
        description: "Successful real LibriSpeech Acoustix run with signed manifests"
        required: true
        default: "42367742782"
        type: string

permissions:
  contents: read
  actions: read

jobs:
  real-speech-odas:
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'test/acoustix-s2-odas-replay') || github.head_ref == 'test/acoustix-s2-ssl-birth-evidence' || github.head_ref == 'test/acoustix-s2-gmm-epsilon-evidence' || github.head_ref == 'test/acoustix-s2-gmm-controlled-sweep' || github.head_ref == 'test/acoustix-s2-horizontal-source-prior' || github.head_ref == 'test/acoustix-s2-zero-ssl-birth-fix-ab' || github.head_ref == 'test/acoustix-s2-zero-ssl-birth-fix-ab' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Download exact previous real-human speech Acoustix artifact
        uses: actions/download-artifact@v4
        with:
          name: acoustix-s2-real-librispeech-evidence
          run-id: ${{ inputs.speech_artifact_run_id || '42367742782' }}
          github-token: ${{ github.token }}
          path: build-s2

      - name: Check baseline provenance and previously rendered WAVs
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path("build-s2")
          baseline = json.loads((root/"real_speech_cpu_audit.json").read_text())
          corpus = json.loads((root/"corpus_audit.json").read_text())
          assert baseline["passed"] and baseline["real_cpu_rir"]
          assert corpus["passed"] and corpus["evidence"]["distinct_speaker_count"] == 7
          assert len(baseline["cases"]) == 3
          for name in ("t02_dev_single", "t03_eval_two", "t07_eval_seven"):
              case = root / name
              wav = case / "render" / "input.wav"
              assert wav.is_file() and wav.stat().st_size > 0
              oracle = json.loads((case/"render"/"ground_truth.json").read_text())
              assert oracle["speech_schedule"]["speech_event_count"] in (1, 2, 7)
              (case/"input_sha256.txt").write_text(
                  hashlib.sha256(wav.read_bytes()).hexdigest()+"\n")
          print("Real human speech artifact provenance and WAVs intact")
          PY

      - name: Install pinned CMake and ODAS native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libfftw3-dev libasound2-dev libconfig-dev libpulse-dev libopenblas-dev
          python3 -m pip install "cmake==4.1.2"
          cmake --version

      - name: Build actual libaudition ODAS SSL/SST/SSS offline runner
        run: |
          cmake -S . -B build-s2-odas -G Ninja             -DCMAKE_BUILD_TYPE=Release             -DLIBAUDITION_WITH_ODAS=ON             -DLIBAUDITION_WITH_SPDLOG=OFF             -DLIBAUDITION_BUILD_TESTS=ON             -DLIBAUDITION_BUILD_EXAMPLES=OFF             -DLIBAUDITION_BUILD_QT_DEMO=OFF             -DLIBAUDITION_WARNINGS_AS_ERRORS=ON
          cmake --build build-s2-odas --target audition_offline_integration --parallel 2
          test -x build-s2-odas/tests/audition_offline_integration

      - name: Replay SAME real human WAVs through libaudition ODAS
        run: |
          for case in t02_dev_single t03_eval_two t07_eval_seven; do
            mkdir -p "build-s2/$case/odas"
            # Fresh trace per exact SHA-pinned WAV; no stale concatenated hops.
            export ODAS_SST_TRACE_JSONL="$PWD/build-s2/$case/odas/sst_raw_trace.jsonl"
            export ODAS_SST_TRACE_HOP_FRAMES=128
            rm -f "$ODAS_SST_TRACE_JSONL"
            build-s2-odas/tests/audition_offline_integration               "build-s2/$case/render/input.wav"               "build-s2/$case/odas"               > "build-s2/$case/odas/runner.stdout.txt"               2> "build-s2/$case/odas/runner.stderr.txt"
            test -s "$ODAS_SST_TRACE_JSONL"
          done

      - name: Validate REAL offline ODAS SSL/SST JSONL (no synthetic oracle)
        run: |
          # The validator comes from the exact pinned external ODAS checkout.
          validator="$(find build-s2-odas -type f -path '*/tools/validate_sst_raw_trace.py' -print -quit)"
          test -n "$validator" && test -f "$validator"
          for case in t02_dev_single t03_eval_two t07_eval_seven; do
            python3 "$validator" "build-s2/$case/odas/sst_raw_trace.jsonl" \
              > "build-s2/$case/odas/sst_trace_integrity.json"
          done

      - name: Download exact pre-fix real-SST trace baseline
        uses: actions/download-artifact@v4
        with:
          name: acoustix-s2-real-odas-diagnostics
          run-id: 42408672657
          github-token: ${{ github.token }}
          path: build-s2-before-slot-fix

      - name: Score ODAS source-track diagnostics vs human-voice DOA oracle
        run: |
          python3 - <<'PY'
          from array import array
          import csv, hashlib, json, math, sys, wave
          from pathlib import Path
          sys.path.insert(0, "tests/integration")
          from acoustix_metrics import compute_metrics
          root = Path("build-s2")
          cases = []
          errors = []
          for name, voices in (
                  ("t02_dev_single", 1), ("t03_eval_two", 2), ("t07_eval_seven", 7)):
              case = root / name
              input_file = case / "render" / "input.wav"
              expected_sha = (case/"input_sha256.txt").read_text().strip()
              if hashlib.sha256(input_file.read_bytes()).hexdigest() != expected_sha:
                  raise RuntimeError("ODAS replay input WAV changed: " + name)
              ground_truth = json.loads(
                  (case/"render"/"ground_truth.json").read_text())
              summary = json.loads((case/"odas"/"summary.json").read_text())
              with (case/"odas"/"observations.csv").open(newline="") as reader:
                  observations = list(csv.DictReader(reader))
              with wave.open(str(input_file), "rb") as wav:
                  if wav.getnchannels() != 6 or wav.getsampwidth() != 2:
                      raise ValueError("Unexpected real-speech six-channel PCM")
                  raw = wav.readframes(wav.getnframes())
                  frames = wav.getnframes()
              samples = array("h")
              samples.frombytes(raw)
              silence_start = 0
              for i in range(frames - 1, -1, -1):
                  if any(samples[i*6+mic] != 0 for mic in range(1, 5)):
                      silence_start = i + 1
                      break
              metrics = compute_metrics(
                  ground_truth["ground_truth"], observations, summary,
                  silence_start_frame=silence_start)
              (case/"odas"/"source_track_metrics.json").write_text(
                  json.dumps(metrics, indent=2) + "\n")
              passed = (
                  int(summary["input_frames"]) == int(ground_truth["wav_frames"])
                  and int(summary["recorder_drops"]) == 0)
              record = {
                  "case": name, "real_speech_sources": voices,
                  "passed_pipeline_integrity": passed,
                  "sample_rate_hz": summary["sample_rate_hz"],
                  "input_sha256": expected_sha,
                  "input_frames": summary["input_frames"],
                  "recorder_drops": summary["recorder_drops"],
                  "ssl_proposals": metrics["potential_observations"],
                  "sst_track_observations": metrics["track_observations"],
                  "max_simultaneous_tracks": metrics["max_simultaneous_tracks"],
                  "oracle_voice_source_hops": metrics["active_voice_source_hops"],
                  "matched_voice_source_hops": metrics["matched_voice_source_hops"],
                  "matched_voice_source_fraction": metrics["matched_voice_source_fraction"],
                  "matched_azimuth_median_deg": metrics["matched_median_azimuth_error_deg"],
                  "matched_azimuth_p90_deg": metrics["matched_p90_azimuth_error_deg"],
                  "adjacent_id_switches": metrics["adjacent_matched_id_switches"],
                  "recordings": metrics["recordings"],
              }
              cases.append(record)
              print(json.dumps(record), flush=True)
              if not passed:
                  errors.append(name + ": frame/recorder-drop integrity failure")
          report = {
              "schema": "libaudition.acoustix-s2-real-odas-diagnostics.v1",
              "real_human_speech": "LibriSpeech dev-clean, CC BY 4.0",
              "source_cpu_rir_artifact_run_id": 42367742782,
              "pcm_wavs_identical_to_source_artifact": True,
              "pipeline_integrity_passed": not errors,
              "cases": cases,
              "limit": "DOA/track association ONLY; no separated PCM leakage, SI-SDRi/SIRi or ASR WER",
              "failed_integrity_cases": errors,
          }
          (root/"real_speech_odas_diagnostics.json").write_text(
              json.dumps(report, indent=2)+"\n")
          if errors:
              raise SystemExit("Real speech ODAS integrity failed: " + "; ".join(errors))
          PY

      - name: Compare identical Acoustix WAV SST decisions before and after slot fix
        run: |
          python3 tests/integration/acoustix_s2_sst_trace_compare.py \
            build-s2-before-slot-fix build-s2 \
            build-s2/paired_sst_slot_fix_comparison.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path(
              "build-s2/paired_sst_slot_fix_comparison.json").read_text())
          evidence = report["cases"]["t03_eval_two"]["hop699"]
          assert evidence["before_eligible_candidates"] >= 3, evidence
          assert len(evidence["before_birth_ids"]) == 1, evidence
          assert len(evidence["after_birth_ids"]) >= 2, (
              "pending-slot regression persists on identical real T03 PCM",
              evidence)
          print("Real-waveform same-hop pending-slot collision fixed:", evidence)
          PY

      - name: Verify exact offline-runner probation defaults (not inferred from JSONL)
        run: |
          python3 - <<'PY'
          from pathlib import Path
          h = Path("backends/odas/include/audition/backends/odas/odas_options.hpp").read_text()
          runner = Path("tests/integration/offline_pipeline_runner.cpp").read_text()
          assert "probability_window{5}" in h, "ODAS default probation window changed"
          assert "probability_threshold{0.8}" in h, "ODAS default probation threshold changed"
          # Reading defaults for summary.json is allowed; modifying is not.
          import re
          assert not re.search(r"options\.sst\.probability_window\s*=", runner)
          assert not re.search(r"options\.sst\.probability_threshold\s*=", runner)
          print("Verified actual offline runner uses OdasOptions five-hop/0.8 defaults")
          PY

      - name: Audit actual SST probation and two-SSL candidate oracle coverage
        run: |
          python3 -m unittest discover -s tests/integration \
            -p 'test_acoustix_s2_probation_audit.py' -v
          python3 tests/integration/acoustix_s2_probation_audit.py \
            --root build-s2 --output build-s2/real_speech_sst_probation_audit.json \
            --probation-window 5 --probation-threshold 0.8
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path(
              "build-s2/real_speech_sst_probation_audit.json").read_text())
          assert report["schema"] == "libaudition.acoustix-s2-odas-probation-audit.v1"
          for name in ("t02_dev_single", "t03_eval_two", "t07_eval_seven"):
              case = report["cases"][name]
              assert case["real_recorded_hops"] == 1875
              assert case["incomplete_births"] == 0, (name, case["incomplete_births"])
              assert case["total_provisional_births"] == (
                  case["confirmed_births"] + case["rejected_births"])
          t03 = report["cases"]["t03_eval_two"]
          assert t03["oracle_two_voice_hops"] > 0
          print("Measured T03 simultaneous speech diagnostic:",
                json.dumps({k: t03[k] for k in (
                    "oracle_two_voice_hops",
                    "two_distinct_ssl_candidates_within_25_deg_hops",
                    "two_distinct_ssl_candidates_within_45_deg_hops",
                    "two_active_sst_tracks_during_two_voice_hops",
                    "provisional_births_during_oracle_multivoice")}, sort_keys=True))
          PY

      - name: Measure real T03 SSL directional continuity and birth-vs-track evidence
        run: |
          python3 -m unittest discover -s tests/integration \
            -p 'test_acoustix_s2_ssl_birth_evidence.py' -v
          python3 tests/integration/acoustix_s2_ssl_birth_evidence.py \
            --artifact-root build-s2 \
            --output build-s2/t03_real_ssl_birth_evidence.json \
            --tolerance 25
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path(
              "build-s2/t03_real_ssl_birth_evidence.json").read_text())
          m = report["diagnostics"]
          assert report["schema"] == "libaudition.acoustix-s2-ssl-birth-evidence.v1"
          assert report["validated_real_odas_hops"] == 1875
          assert report["input_pcm_sha256"] == (
              "c14fe750e47064de1b105c5fceab1ffe8e5330157b7519818a5c175d6c54f0ee")
          # Frozen real PCM baseline, not a quality acceptance threshold.
          assert m["oracle_two_voice_hops"] == 243
          assert m["two_distinct_ssl_direction_hops"] == 97
          assert m["any_two_candidates_above_birth_threshold_hops"] == 0
          assert m["distinct_ssl_streaks"]["runs_at_least_5_hops"] == 5
          assert m["two_active_sst_tracks_hops"] == 0
          assert m["speaker_direction_matches"]["speaker_2"]["above_birth_threshold_hops"] == 0
          assert m["speaker_direction_matches"]["speaker_2"]["dominant_posterior_class"] == {
              "new_source": 0, "existing_track": 27,
              "unassigned_residual": 70, "ambiguous": 0
          }
          print("T03 measured directional/association baseline:", json.dumps({
              "two_oracle_voice_hops": m["oracle_two_voice_hops"],
              "two_distinct_ssl_hops": m["two_distinct_ssl_direction_hops"],
              "distinct_streaks": m["distinct_ssl_streaks"],
              "speaker_2_birth": m["speaker_direction_matches"]["speaker_2"]["birth_posterior"],
              "speaker_2_mass_fate": m["speaker_direction_matches"]["speaker_2"]["dominant_posterior_class"],
              "two_birth_evidence_hops": m["any_two_candidates_above_birth_threshold_hops"]
          }, sort_keys=True))
          PY

      - name: Diagnose native ODAS GMM false/new likelihood and absolute epsilon floor
        run: |
          python3 -m unittest discover -s tests/integration \
            -p 'test_acoustix_s2_gmm_epsilon_audit.py' -v
          python3 - <<'PY'
          from pathlib import Path
          h = Path("backends/odas/include/audition/backends/odas/odas_options.hpp").read_text()
          run = Path("tests/integration/offline_pipeline_runner.cpp").read_text()
          deps = Path("cmake/Dependencies.cmake").read_text()
          for needle in (
              "active_gmm{{1.0, 0.4, 0.0025}}",
              "inactive_gmm{{1.0, 0.25, 0.0025}}",
              "false_probability{0.1}",
              "new_probability{0.1}",
              "new_threshold{0.9}",
          ):
              assert needle in h, ("Native GMM/prior default changed", needle)
          # Explicit test-only single-factor overrides are permitted.
          assert "if (experiment.activeMean) options.sst.active_gmm.front().mean = *experiment.activeMean;" in run
          assert "if (experiment.activeVariance) options.sst.active_gmm.front().variance = *experiment.activeVariance;" in run
          assert "if (experiment.falsePrior) options.sst.false_probability = *experiment.falsePrior;" in run
          assert "options.sst.inactive_gmm" not in run
          import re
          assert not re.search(r"options\.sst\.new_probability\s*=", run)
          assert "GIT_TAG 76da9ec6be6dce89cbfbdb5fb241e7180297b53c" in deps
          print("Native ODAS GMM/priors and exact traced ODAS dependency verified")
          PY
          python3 tests/integration/acoustix_s2_gmm_epsilon_audit.py \
            --artifact-root build-s2 \
            --output build-s2/real_speech_gmm_epsilon_audit.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path(
              "build-s2/real_speech_gmm_epsilon_audit.json").read_text())
          assert report["schema"] == "libaudition.acoustix-s2-native-gmm-epsilon-evidence.v1"
          expected = {
              "t02_dev_single": (7500, 7),
              "t03_eval_two": (7500, 14),
              "t07_eval_seven": (7500, 0),
          }
          for case_name, (candidates, epsilon_count) in expected.items():
              case = report["cases"][case_name]
              assert case["hops"] == 1875, case_name
              assert case["candidates"] == candidates, case_name
              assert case["epsilon_dominant"] == epsilon_count, case_name
          print("Actual real-PCM ODAS GMM/epsilon evidence:", json.dumps(
              {name: {
                  "epsilon_dominant": case["epsilon_dominant"],
                  "strong_ssl_gt_0_8": case["strong_ssl_gt_0_8"],
                  "strong_ssl_gt_0_8_birth_lt_0_01":
                      case["strong_ssl_gt_0_8_birth_lt_0_01"]
              } for name, case in report["cases"].items()}, sort_keys=True))
          PY

      - name: Native GMM parameter sensitivity on identical real PCM and synthetic T00 silence
        run: |
          python3 -m unittest discover -s tests/integration \
            -p 'test_acoustix_s2_gmm_controlled_sweep.py' -v
          python3 -m unittest discover -s tests/integration \
            -p 'test_acoustix_s2_gmm_doa_audit.py' -v
          validator="$(find build-s2-odas -type f -path '*/tools/validate_sst_raw_trace.py' -print -quit)"
          test -f "$validator"
          python3 tests/integration/acoustix_s2_gmm_controlled_sweep.py \
            --artifact-root build-s2 \
            --runner build-s2-odas/tests/audition_offline_integration \
            --validator "$validator" \
            --output build-s2/gmm-sweep
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("build-s2/gmm-sweep/gmm_sweep_report.json").read_text())
          assert report["schema"] == "libaudition.s2_native_gmm_sensitivity.v1"
          expected = ("baseline", "active_mean_030",
                      "active_var_001", "false_prior_003")
          assert set(report["variants"]) == set(expected)
          for variant in expected:
              cases = report["variants"][variant]["cases"]
              assert set(cases) == {
                  "t00_zero_pcm_control", "t02_dev_single",
                  "t03_eval_two", "t07_eval_seven"}
              assert cases["t00_zero_pcm_control"]["metrics"]["validated_128_frame_hops"] == 1875
              assert cases["t03_eval_two"]["metrics"]["oracle_exactly_two_voice_hops"] == 243
              spatial = cases["t03_eval_two"]["spatial_oracle_diagnostics"]
              assert spatial["oracle_exactly_two_voice_hops"] == 243
              assert (spatial["two_or_more_active_tracks_in_overlap_hops"] ==
                      cases["t03_eval_two"]["metrics"]["oracle_two_voice_hops_with_at_least_two_active_tracks"])
              # New algorithm invariant: no SST births from zero-score
              # SSL placeholders, irrespective of the GMM setting.
              assert cases["t00_zero_pcm_control"]["metrics"]["birth_events"] == 0
              assert cases["t00_zero_pcm_control"]["metrics"]["hops_any_active"] == 0
              assert (spatial["two_distinct_track_to_voice_matches_within_45deg_hops"] <=
                      spatial["two_or_more_active_tracks_in_overlap_hops"])
              for case in ("t02_dev_single", "t03_eval_two", "t07_eval_seven"):
                  assert cases[case]["wav_sha256"] == (
                      report["variants"]["baseline"]["cases"][case]["wav_sha256"])
          print("Measured native replay complete: tracking diagnostics, not speech-separation acceptance")
          for name in expected:
              c = report["variants"][name]["cases"]
              print(name, "T00 synthetic zero-PCM active hops:",
                    c["t00_zero_pcm_control"]["metrics"]["hops_any_active"],
                    "T02 max active:",
                    c["t02_dev_single"]["metrics"]["max_simultaneous_active_tracks"],
                    "T03 two-active-overlap hops:",
                    c["t03_eval_two"]["metrics"]["oracle_two_voice_hops_with_at_least_two_active_tracks"],
                    "T07 max active:",
                    c["t07_eval_seven"]["metrics"]["max_simultaneous_active_tracks"],
                    "T03 distinct 45-degree two-voice matches:",
                    c["t03_eval_two"]["spatial_oracle_diagnostics"]["two_distinct_track_to_voice_matches_within_45deg_hops"],
                    "T00 provisional births:",
                    c["t00_zero_pcm_control"]["metrics"]["birth_events"])
          PY

      - name: Real-waveform horizontal source-prior ablation with independent active-track 3D oracle matches
        run: |
          python3 -m unittest discover -s tests/integration \
            -p 'test_acoustix_s2_horizontal_prior_ab.py' -v
          validator="$(find build-s2-odas -type f -path '*/tools/validate_sst_raw_trace.py' -print -quit)"
          test -f "$validator"
          python3 tests/integration/acoustix_s2_horizontal_prior_ab.py \
            --artifact-root build-s2 \
            --runner build-s2-odas/tests/audition_offline_integration \
            --validator "$validator" \
            --output build-s2/horizontal-prior-ab
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("build-s2/horizontal-prior-ab/horizontal_prior_report.json")
          result = json.loads(p.read_text())
          assert result["schema"] == "libaudition.s2_horizontal_prior_ab_v1"
          variants = result["variants"]
          assert set(variants) == {
              "baseline_off", "baseline_plane",
              "active_var_001_off", "active_var_001_plane"}
          baseline = variants["baseline_off"]["cases"]
          wide = variants["active_var_001_off"]["cases"]
          assert baseline["t03_eval_two"]["t03_distinct_speaker_3d_matches"]["oracle_exactly_two_voice_hops"] == 243
          assert baseline["t03_eval_two"]["t03_distinct_speaker_3d_matches"]["two_or_more_active_tracks_in_overlap_hops"] == 0
          # Do not freeze the old misleading active-track count; this
          # experiment changes whether zero-strength SST births are legal.
          # Only the no-evidence invariant and immutable source oracle
          # remain hard gates.
          assert wide["t00_zero_pcm_control"]["tracker_metrics"]["birth_events"] == 0
          assert wide["t00_zero_pcm_control"]["tracker_metrics"]["hops_any_active"] == 0
          for name, variant in variants.items():
              cases = variant["cases"]
              assert set(cases) == {
                  "t00_zero_pcm_control", "t02_dev_single",
                  "t03_eval_two", "t07_eval_seven"}
              assert cases["t03_eval_two"]["t03_distinct_speaker_3d_matches"]["oracle_exactly_two_voice_hops"] == 243
              assert cases["t03_eval_two"]["tracker_metrics"]["validated_128_frame_hops"] == 1875
              for case in ("t02_dev_single", "t03_eval_two", "t07_eval_seven"):
                  assert (cases[case]["input_wav_sha256"] ==
                          baseline[case]["input_wav_sha256"]), (name, case)
              # A high two-track count with no 3D oracle matches is NOT quality improvement.
              g = cases["t03_eval_two"]["t03_distinct_speaker_3d_matches"]
              print(name,
                    "true 2-voice 45deg hits:", g["two_distinct_track_to_voice_matches_within_45deg_hops"],
                    "two-active hops:", g["two_or_more_active_tracks_in_overlap_hops"],
                    "high-elevation SST track observations:",
                    cases["t03_eval_two"]["native_3d_track_elevation"]["active_track_observations_above_45deg_absolute_elevation"],
                    "T00 synthetic births:",
                    cases["t00_zero_pcm_control"]["tracker_metrics"]["birth_events"])
          PY

      - name: Download exact pre-zero-birth-guard Acoustix native evidence
        uses: actions/download-artifact@v4
        with:
          name: acoustix-s2-real-odas-diagnostics
          run-id: 42444370597
          github-token: \${{ github.token }}
          path: build-s2-before-zero-ssl-guard

      - name: Compare real native ODAS zero-evidence birth fix against identical pre-fix WAV/variant artifacts
        run: |
          python3 -m unittest discover -s tests/integration \
            -p 'test_acoustix_s2_zero_evidence_birth_compare.py' -v
          python3 tests/integration/acoustix_s2_zero_evidence_birth_compare.py \
            --before build-s2-before-zero-ssl-guard \
            --after build-s2 \
            --output build-s2/zero_ssl_birth_guard_before_after.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path(
              "build-s2/zero_ssl_birth_guard_before_after.json").read_text())
          assert report["schema"] == "libaudition.zero_ssl_potential_birth_native_ab_v1"
          assert set(report["variants"]) == {
              "baseline_off", "baseline_plane",
              "active_var_001_off", "active_var_001_plane"}
          for mode, variant in report["variants"].items():
              cases = variant["cases"]
              before = cases["t00_zero_pcm_control"]["before"]["birth_events"]
              after = cases["t00_zero_pcm_control"]["after"]["birth_events"]
              assert after == 0, (mode, before, after)
              if variant["gmm"] == "active_var_001":
                  assert before == 1252, (mode, before)
              assert cases["t03_eval_two"]["after_3d"]["oracle_exactly_two_voice_hops"] == 243
              print(mode, "synthetic T00 births", before, "->", after,
                    "T03 genuine two-person 45deg matches:",
                    cases["t03_eval_two"]["after_3d"]["two_distinct_track_to_voice_matches_within_45deg_hops"])
          PY

      - name: Verify frozen real-speech ODAS baseline comparison and adversarial contracts
        run: |
          PYTHONPATH=tests/integration python3 -m unittest tests/integration/test_acoustix_s2_baseline.py -v
          python3 tests/integration/acoustix_s2_baseline.py \
            tests/fixtures/acoustix/s2_real_odas_baseline.json \
            build-s2/real_speech_odas_diagnostics.json \
            build-s2/real_speech_odas_baseline_comparison.json

      - name: Report real human speech SST tracking (diagnostic only)
        if: always()
        run: |
          {
            echo "## ODAS/libaudition on unchanged real LibriSpeech microphone WAVs"
            echo ""
            echo "DOA association and lifecycle diagnostic, NOT source separation audio quality."
            echo ""
            if test -f build-s2/real_speech_odas_diagnostics.json; then
              cat build-s2/real_speech_odas_diagnostics.json
            else
              echo "No complete diagnostics. Inspect job logs and artifacts."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload real-speech ODAS inputs, observations and track diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acoustix-s2-real-odas-diagnostics
          path: build-s2/
          retention-days: 14
          if-no-files-found: warn
