name: Acoustix S2 ODAS upstream-dev-feature A/B (real replay)
on:
  pull_request:
    branches: [test/acoustix-s2-upstream-dev-feature-ab]
    paths:
      - '.github/workflows/acoustix-s2-odas-ab.yml'
      - 'tests/integration/odas_paired_quality_verdict.py'
      - 'tests/integration/test_odas_paired_quality_verdict.py'
      - 'tests/integration/acoustix_metrics.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  render-fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      MPLBACKEND: Agg
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install research-only CPU acoustic dependencies and ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libpulse-dev libopenblas-dev
          python -m venv "$RUNNER_TEMP/acoustix"
          "$RUNNER_TEMP/acoustix/bin/pip" install --upgrade pip
          "$RUNNER_TEMP/acoustix/bin/pip" install --index-url https://download.pytorch.org/whl/cpu             "torch==2.9.1+cpu" "torchaudio==2.9.1+cpu"
          "$RUNNER_TEMP/acoustix/bin/pip" install             "numpy==2.3.5" "scipy==1.16.3" "pyroomacoustics==0.8.6"             "matplotlib>=3.10.7" "soundcard>=0.4.5"             "experiment-utilities>=0.3.9" "tqdm>=4.67.1" "pyzmq>=27.0"
          "$RUNNER_TEMP/acoustix/bin/pip" install --no-deps             "git+https://github.com/GaetanLepage/acoustix.git@32143bfd38c6f2196244e42e2385df48a71df7a4"

      - name: Download original licensed human-voice LibriSpeech dev-clean
        run: |
          mkdir -p "$RUNNER_TEMP/librispeech"
          curl -fL --retry 3 --retry-all-errors --connect-timeout 20 --max-time 1200             https://openslr.trmal.net/resources/12/dev-clean.tar.gz             -o "$RUNNER_TEMP/librispeech/dev-clean.tar.gz"
          echo "42e2234ba48799c1f50f24a7926300a1  $RUNNER_TEMP/librispeech/dev-clean.tar.gz" | md5sum -c -
          tar -xzf "$RUNNER_TEMP/librispeech/dev-clean.tar.gz" -C "$RUNNER_TEMP/librispeech"
          test -d "$RUNNER_TEMP/librispeech/LibriSpeech/dev-clean"
          mkdir -p build-s2
          cat > build-s2/ATTRIBUTION.txt <<'TXT'
          Human speech derived from LibriSpeech ASR corpus, OpenSLR SLR12.
          V. Panayotov, G. Chen, D. Povey, S. Khudanpur, ICASSP 2015.
          Source: https://www.openslr.org/12/
          License: Creative Commons Attribution 4.0 (CC BY 4.0)
          https://creativecommons.org/licenses/by/4.0/
          Internal evaluation split means different utterances from dev-clean,
          not official test-clean and not held-out speakers.
          TXT

      - name: Prepare seven real speakers and audit licensed PCM/tracks
        run: |
          "$RUNNER_TEMP/acoustix/bin/python" tests/integration/prepare_librispeech_s2.py             --librispeech-dir "$RUNNER_TEMP/librispeech/LibriSpeech/dev-clean"             --output build-s2/selected-pcm             --manifest build-s2/speech_corpus.json
          "$RUNNER_TEMP/acoustix/bin/python" tests/integration/acoustix_speech_corpus.py             --manifest build-s2/speech_corpus.json             --root build-s2/selected-pcm             --report build-s2/corpus_audit.json

      - name: Create frozen real-voice T02/T03/T07 acoustic scene/plan pairs
        run: |
          "$RUNNER_TEMP/acoustix/bin/python" tests/integration/prepare_acoustix_s2_scene.py             --corpus-manifest build-s2/speech_corpus.json             --corpus-root build-s2/selected-pcm             --speakers 1 --split development --robot-motion stationary             --no-background --output build-s2/t02_dev_single
          "$RUNNER_TEMP/acoustix/bin/python" tests/integration/prepare_acoustix_s2_scene.py             --corpus-manifest build-s2/speech_corpus.json             --corpus-root build-s2/selected-pcm             --speakers 2 --split evaluation --robot-motion moving             --no-background --output build-s2/t03_eval_two
          "$RUNNER_TEMP/acoustix/bin/python" tests/integration/prepare_acoustix_s2_scene.py             --corpus-manifest build-s2/speech_corpus.json             --corpus-root build-s2/selected-pcm             --speakers 7 --split evaluation --robot-motion moving             --rt60-s 0.36 --output build-s2/t07_eval_seven

      - name: Render actual licensed voices through pinned Acoustix CPU RIR
        run: |
          for case in t02_dev_single t03_eval_two t07_eval_seven; do
            extra=()
            if [[ "$case" == "t07_eval_seven" ]]; then
              extra=(--background-snr-db 6)
            fi
            "$RUNNER_TEMP/acoustix/bin/python" tests/integration/acoustix_scene.py               --scene "build-s2/$case/scene.json"               --speech-plan "build-s2/$case/speech_plan.json"               --speech-corpus-manifest build-s2/speech_corpus.json               --speech-corpus-root build-s2/selected-pcm               --output "build-s2/$case/render"               --seed 5161 --hop-ms 250 --stems "${extra[@]}"
          done

      - name: Independently verify actual speech render and immutable references
        run: |
          "$RUNNER_TEMP/acoustix/bin/python" - <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path
          sys.path.insert(0, "tests/integration")
          from acoustix_timing_contract import verify_timing
          from acoustix_signal_contract import audit_audio
          root = Path("build-s2")
          corpus = json.loads((root / "corpus_audit.json").read_text())
          assert corpus["passed"] and corpus["evidence"]["distinct_speaker_count"] == 7
          assert corpus["evidence"]["distinct_utterance_count"] >= 21
          results = []
          for name, expected_voices in (
                  ("t02_dev_single", 1), ("t03_eval_two", 2), ("t07_eval_seven", 7)):
              base = root / name
              scene = json.loads((base / "scene.json").read_text())
              folder = base / "render"
              oracle = json.loads((folder / "ground_truth.json").read_text())
              schedule = json.loads((folder / "speech_schedule.json").read_text())
              assert oracle["speech_schedule"] == schedule
              assert schedule["voice_source_count"] == expected_voices
              assert schedule["speech_event_count"] == expected_voices
              time = verify_timing(scene, oracle, folder / "input.wav")
              audit = audit_audio(
                  folder / "input.wav", folder / "stems",
                  [src["id"] for src in scene["sources"]])
              assert audit["reconstruction_max_residual_lsb"] <= audit["quantization_allowance_lsb"]
              for source_id, sha in schedule["clean_reference_wav_sha256"].items():
                  reference = folder / "clean_refs" / (source_id + ".wav")
                  assert hashlib.sha256(reference.read_bytes()).hexdigest() == sha
              results.append({
                  "case": name, "voices": expected_voices,
                  "clean_reference_count": len(schedule["clean_reference_wav_sha256"]),
                  "output_frames": time["wav_frames"],
                  "source_stem_audit_lsb": audit["reconstruction_max_residual_lsb"],
                  "passed": True
              })
              print(json.dumps(results[-1]), flush=True)
          (root / "real_speech_cpu_audit.json").write_text(json.dumps({
              "schema": "libaudition.acoustix-s2-real-speech-cpu.v1",
              "passed": True,
              "real_human_voices_from": "LibriSpeech SLR12 dev-clean, CC BY 4.0",
              "real_cpu_rir": True,
              "cases": results,
              "not_validated": [
                  "ODAS separated-track signal leakage",
                  "speech-to-speech SIRi, SI-SDRi",
                  "ASR WER and first-word transcription",
                  "true phoneme onset within source recordings",
                  "physical microphone correlation"
              ],
          }, indent=2) + "\n")
          PY

      - name: Upload freshly rendered immutable input and oracle for all variants
        uses: actions/upload-artifact@v4
        with:
          name: acoustix-s2-frozen-fixture
          path: build-s2/
          retention-days: 14
          if-no-files-found: error
  paired-replay:
    needs: render-fixture
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: upstream
            odas_sha: 004cb824c6073771cb23cf9139f01e9d8581025b
          - variant: dev
            odas_sha: 4c8e3bfcb56124ee340477a2443ea2ebe11ee712
          - variant: feature
            odas_sha: fdce209c0aa86d1e2a944b9cbc0a88eaed897bda
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Download this run's single verified Acoustix render
        uses: actions/download-artifact@v4
        with:
          name: acoustix-s2-frozen-fixture
          path: build-s2
      - name: Freeze per-case SHA-256 and validate CPU RIR provenance
        run: |
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path("build-s2")
          audit=json.loads((root/"real_speech_cpu_audit.json").read_text())
          corpus=json.loads((root/"corpus_audit.json").read_text())
          assert audit["passed"] and audit["real_cpu_rir"] and corpus["passed"]
          for case in ("t02_dev_single","t03_eval_two","t07_eval_seven"):
              wav=root/case/"render"/"input.wav"
              assert wav.is_file() and wav.stat().st_size>44
              (root/case/"input_sha256.txt").write_text(hashlib.sha256(wav.read_bytes()).hexdigest()+"\n")
          PY
      - name: Install native ODAS build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libfftw3-dev libasound2-dev libconfig-dev libpulse-dev libopenblas-dev
          python3 -m pip install "cmake==4.1.2"
      - name: Pin EXACT ODAS revision for this independent build
        env:
          ODAS_SHA: ${{ matrix.odas_sha }}
        run: |
          python3 - <<'PY'
          import os,re
          from pathlib import Path
          p=Path("cmake/Dependencies.cmake")
          s=p.read_text()
          start=s.index("function(libaudition_find_or_fetch_odas)")
          end=s.index("endfunction()",start)+len("endfunction()")
          block=s[start:end]
          block,n=re.subn(r"GIT_TAG [0-9a-f]{40}", "GIT_TAG "+os.environ["ODAS_SHA"],block)
          assert n==1,(n,block)
          p.write_text(s[:start]+block+s[end:])
          print("ODAS exact SHA",os.environ["ODAS_SHA"])
          PY
      - name: Build actual libaudition offline SSL/SST/SSS runner
        run: |
          cmake -S . -B build-ab -G Ninja -DCMAKE_BUILD_TYPE=Release -DLIBAUDITION_WITH_ODAS=ON -DLIBAUDITION_WITH_SPDLOG=OFF -DLIBAUDITION_BUILD_TESTS=ON -DLIBAUDITION_BUILD_EXAMPLES=OFF -DLIBAUDITION_BUILD_QT_DEMO=OFF -DLIBAUDITION_WARNINGS_AS_ERRORS=ON
          cmake --build build-ab --target audition_offline_integration --parallel 2
          test -x build-ab/tests/audition_offline_integration
      - name: Replay byte-identical WAVs through REAL ODAS backend
        run: |
          for case in t02_dev_single t03_eval_two t07_eval_seven; do
            mkdir -p "build-s2/$case/odas"
            export ODAS_SST_TRACE_JSONL="$PWD/build-s2/$case/odas/sst_raw_trace.jsonl"
            export ODAS_SST_TRACE_HOP_FRAMES=128
            rm -f "$ODAS_SST_TRACE_JSONL"
            build-ab/tests/audition_offline_integration "build-s2/$case/render/input.wav" "build-s2/$case/odas" > "build-s2/$case/odas/runner.stdout.txt" 2> "build-s2/$case/odas/runner.stderr.txt"
            test -s "build-s2/$case/odas/summary.json"
            test -s "build-s2/$case/odas/observations.csv"
          done
      - name: Score actual SST oracle matches, DOA and track counts
        env:
          VARIANT: ${{ matrix.variant }}
          ODAS_SHA: ${{ matrix.odas_sha }}
        run: |
          python3 - <<'PY'
          import csv,hashlib,json,os,sys
          from pathlib import Path
          sys.path.insert(0,"tests/integration")
          from acoustix_metrics import compute_metrics
          root=Path("build-s2")
          report={"variant":os.environ["VARIANT"],"odas_sha":os.environ["ODAS_SHA"],"cases":{}}
          for name in ("t02_dev_single","t03_eval_two","t07_eval_seven"):
              case=root/name
              wav=case/"render"/"input.wav"
              sha=hashlib.sha256(wav.read_bytes()).hexdigest()
              assert sha==(case/"input_sha256.txt").read_text().strip()
              oracle=json.loads((case/"render"/"ground_truth.json").read_text())
              summary=json.loads((case/"odas"/"summary.json").read_text())
              with (case/"odas"/"observations.csv").open(newline="") as f:
                  observations=list(csv.DictReader(f))
              assert int(summary["input_frames"])==int(oracle["wav_frames"])
              assert int(summary["recorder_drops"])==0
              metrics=compute_metrics(oracle["ground_truth"],observations,summary)
              report["cases"][name]={"wav_sha256":sha,"oracle_sha256":hashlib.sha256((case/"render"/"ground_truth.json").read_bytes()).hexdigest(),"metrics":metrics}
          (root/"ab_result.json").write_text(json.dumps(report,indent=2,sort_keys=True)+"\n")
          print(json.dumps(report,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: odas-ab-${{ matrix.variant }}
          path: |
            build-s2/ab_result.json
            build-s2/*/odas/
            build-s2/*/input_sha256.txt
          retention-days: 14
          if-no-files-found: warn
  compare:
    needs: paired-replay
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: odas-ab-*
          path: results
      - name: Reject incomplete or incomparable A/B and report differences
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          variants={}
          for name in ("upstream","dev","feature"):
              p=Path("results")/("odas-ab-"+name)/"ab_result.json"
              if not p.exists():
                  raise SystemExit("BLOCKED: missing actual ODAS run "+name)
              variants[name]=json.loads(p.read_text())
          for case in ("t02_dev_single","t03_eval_two","t07_eval_seven"):
              fingerprints={(v["cases"][case]["wav_sha256"],v["cases"][case]["oracle_sha256"]) for v in variants.values()}
              if len(fingerprints)!=1:
                  raise SystemExit("FAIL: incomparable WAV/oracle "+case)
              print("CASE",case)
              for name,v in variants.items():
                  m=v["cases"][case]["metrics"]
                  print(name,v["odas_sha"],json.dumps({k:m.get(k) for k in ("max_simultaneous_tracks","matched_voice_source_fraction","matched_median_azimuth_error_deg","matched_p90_azimuth_error_deg","adjacent_matched_id_switches","unmatched_track_observations_during_voice","max_unmatched_tracks_during_voice","distinct_unmatched_track_ids_during_voice","max_consecutive_unmatched_track_hops_during_voice","fully_matched_multi_voice_fraction")},sort_keys=True))
          Path("results/ab_comparison.json").write_text(json.dumps(variants,indent=2,sort_keys=True))
          PY
      - name: Validate paired quality contracts and produce explicit BLOCKED verdict
        run: |
          python3 -m compileall -q tests/integration/odas_paired_quality_verdict.py tests/integration/test_odas_paired_quality_verdict.py
          PYTHONPATH=tests/integration python3 -m unittest -v test_odas_paired_quality_verdict
          python3 tests/integration/odas_paired_quality_verdict.py results --output results/ab_quality_verdict.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: odas-ab-comparison
          path: |
            results/ab_comparison.json
            results/ab_quality_verdict.json
          if-no-files-found: warn
