name: Acoustix acoustic room (headless)

# The regular PR CI validates scene geometry through CTest. This opt-in job
# installs a research-only GPL-3.0 Python simulator and exercises actual
# room reflections + moving microphones + the libaudition ODAS runner.
on:
  # One full 12s PR acceptance run when explicitly marked ready for review;
  # workflow_dispatch remains available for smaller development smokes.
  pull_request:
    types: [ready_for_review]
  workflow_dispatch:
    inputs:
      duration_seconds:
        description: "Simulated seconds (1.5 smoke, 12 complete scenario)"
        required: true
        default: "1.5"
        type: choice
        options:
          - "1.5"
          - "3"
          - "12"
      rir_hop_ms:
        description: "RIR snapshot spacing; smaller is more expensive"
        required: true
        default: "250"
        type: choice
        options:
          - "100"
          - "250"
          - "500"

permissions:
  contents: read

jobs:
  headless-acoustix-room:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ODAS and acoustic build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libfftw3-dev libasound2-dev libconfig-dev libpulse-dev libopenblas-dev
      - name: Install pinned CMake for ODAS
        run: |
          python -m pip install "cmake==4.1.2"
          cmake --version
      - name: Install isolated Acoustix CPU dependencies
        run: |
          python -m venv "$RUNNER_TEMP/acoustix"
          "$RUNNER_TEMP/acoustix/bin/pip" install --upgrade pip
          "$RUNNER_TEMP/acoustix/bin/pip" install --index-url https://download.pytorch.org/whl/cpu \
            "torch==2.9.1+cpu" "torchaudio==2.9.1+cpu"
          "$RUNNER_TEMP/acoustix/bin/pip" install \
            "numpy==2.3.5" "scipy==1.16.3" "pyroomacoustics==0.8.6" \
            "matplotlib>=3.10.7" "soundcard>=0.4.5" \
            "experiment-utilities>=0.3.9" "tqdm>=4.67.1" "pyzmq>=27.0"
          "$RUNNER_TEMP/acoustix/bin/pip" install --no-deps \
            "git+https://github.com/GaetanLepage/acoustix.git@32143bfd38c6f2196244e42e2385df48a71df7a4"
          # soundcard requires sys.argv[1] for its import-time initialization.
          # The actual headless renderer isolates the unused audio-device import.
          "$RUNNER_TEMP/acoustix/bin/python" -c 'import sys, types; sys.modules["soundcard"] = types.ModuleType("soundcard"); import acoustix, pyroomacoustics; print("Acoustix CPU backend available")' acoustix-probe
      - name: Configure ODAS and opt-in Acoustix CTest
        env:
          DURATION: ${{ inputs.duration_seconds || '12' }}
          HOP_MS: ${{ inputs.rir_hop_ms || '250' }}
        run: |
          cmake -S . -B build-acoustix -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLIBAUDITION_WITH_ODAS=ON \
            -DLIBAUDITION_WITH_SPDLOG=OFF \
            -DLIBAUDITION_BUILD_TESTS=ON \
            -DLIBAUDITION_BUILD_EXAMPLES=OFF \
            -DLIBAUDITION_BUILD_QT_DEMO=OFF \
            -DLIBAUDITION_WARNINGS_AS_ERRORS=ON \
            -DLIBAUDITION_ENABLE_ACOUSTIX_SCENE_TESTS=ON \
            -DLIBAUDITION_ACOUSTIX_EXPORT_STEMS=ON \
            -DLIBAUDITION_ACOUSTIX_COMPARE_CAPACITY=ON \
            "-DLIBAUDITION_ACOUSTIX_RENDER_SECONDS=$DURATION" \
            "-DLIBAUDITION_ACOUSTIX_HOP_MS=$HOP_MS" \
            "-DPython3_EXECUTABLE=$RUNNER_TEMP/acoustix/bin/python"
      - name: Build offline ODAS integration runner
        run: cmake --build build-acoustix --target audition_offline_integration --parallel 2
      - name: Validate room and run the genuine RIR-to-ODAS CTest
        env:
          MPLBACKEND: Agg
          OMP_NUM_THREADS: "2"
          OPENBLAS_NUM_THREADS: "2"
        run: |
          ctest --no-tests=error --test-dir build-acoustix \
            -R '^audio_acoustix_(scene_contract|metrics_selftest|signal_selftest|physics_selftest|rir_physics|dynamic_room) \
            --output-on-failure --verbose
      - name: Summarize acoustic tracking diagnostics
        if: always()
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path("build-acoustix/tests/acoustix_7x7/metrics.json")
          if path.is_file():
              m = json.loads(path.read_text())
              rows = [
                  "### Acoustix moving-room spatial diagnostics",
                  "",
                  "> Synthetic reverberant scene; diagnostics are not calibrated real-room accuracy gates.",
                  "",
                  "| Metric | Result |",
                  "| --- | ---: |",
                  f"| Active voices (maximum) | {m['max_active_voices']} |",
                  f"| Simultaneous ODAS tracks (maximum) | {m['max_simultaneous_tracks']} |",
                  f"| Matched voice-source hop fraction (45°) | {100*m['matched_voice_source_fraction']:.2f}% |",
                  f"| 3D DOA median / P90 | {m['matched_median_3d_angular_error_deg']}° / {m['matched_p90_3d_angular_error_deg']}° |",
                  f"| Azimuth median / P90 (matched) | {m['matched_median_azimuth_error_deg']}° / {m['matched_p90_azimuth_error_deg']}° |",
                  f"| Adjacent matched ID switches | {m['adjacent_matched_id_switches']} / {m['adjacent_matched_id_comparisons']} |",
                  f"| SSL proposals / track observations | {m['potential_observations']} / {m['track_observations']} |",
                  f"| Saved recordings / dropped frames | {m['recordings']} / {m['recorder_drops']} |",
                  f"| Mic silence start | {m.get('microphone_digital_silence_start_s', 'n/a')} s |",
                  f"| ODAS track observations during exact mic silence | {m.get('microphone_digital_silence_track_observations', 'n/a')} |",
                  f"| Last ODAS observation during mic silence | {m.get('microphone_digital_silence_track_last_seen_s', 'n/a')} s |",
                  "",
                  "| Speaker | Matched source-hops | Active source-hops |",
                  "| --- | ---: | ---: |",
              ]
              for name, values in m["per_voice"].items():
                  rows.append(f"| {name} | {values['matched_hops']} | {values['active_hops']} |")
          else:
              rows = ["### Acoustix room diagnostics", "", "No metrics.json was generated; see failed CTest and job logs."]
          compare_path = Path("build-acoustix/tests/acoustix_7x7/capacity_comparison.json")
          if compare_path.is_file():
              c = json.loads(compare_path.read_text())
              names = ["4x4", "4x8", "8x4", "8x8"]
              configs = c["configurations"]
              rows.extend([
                  "",
                  "### ODAS factorial capacity sweep (same microphone WAV)",
                  "",
                  "First number = SSL proposals, second = SST tracker slots. Only capacity changes.",
                  "",
                  "| Metric | 4/4 | 4/8 | 8/4 | 8/8 |",
                  "| --- | ---: | ---: | ---: | ---: |",
              ])
              for title, key in [
                  ("Maximum simultaneous tracks", "max_simultaneous_tracks"),
                  ("Median peak SSL activity", "median_peak_ssl_activity"),
                  ("SSL proposals", "potential_observations"),
                  ("Matched voice-source hops (45°)", "matched_voice_source_hops"),
                  ("Matched voice fraction", "matched_voice_source_fraction"),
                  ("Median 3D angular error, matched only", "matched_median_3d_angular_error_deg"),
                  ("Median azimuth error, matched only", "matched_median_azimuth_error_deg"),
                  ("P90 azimuth error, matched only", "matched_p90_azimuth_error_deg"),
                  ("Track observations", "track_observations"),
                  ("Saved recordings", "recordings"),
              ]:
                  cells = " | ".join(str(configs[name][key]) for name in names)
                  rows.append(f"| {title} | {cells} |")
              rows.extend([
                  "",
                  "### SSL capacity sensitivity with eight SST tracking slots",
                  "",
                  "| Metric | 4 SSL | 5 SSL | 6 SSL | 7 SSL | 8 SSL |",
                  "| --- | ---: | ---: | ---: | ---: | ---: |",
              ])
              ssl_names = ["4x8", "5x8", "6x8", "7x8", "8x8"]
              for title, key in [
                  ("Maximum simultaneous tracks", "max_simultaneous_tracks"),
                  ("SSL proposals", "potential_observations"),
                  ("Median peak SSL activity", "median_peak_ssl_activity"),
                  ("Matched voice-source hops", "matched_voice_source_hops"),
                  ("Track observations", "track_observations"),
              ]:
                  cells = " | ".join(str(configs[name][key]) for name in ssl_names)
                  rows.append(f"| {title} | {cells} |")
              rows.extend([
                  "",
                  "### Explicit SST input isolation at eight SSL proposals",
                  "",
                  "| Metric | SSL8 → SST8 (all eight) | SSL8 → SST8 (strongest four) |",
                  "| --- | ---: | ---: |",
              ])
              for title, key in [
                  ("Raw SSL proposals", "potential_observations"),
                  ("Confirmed track observations", "track_observations"),
                  ("Maximum simultaneous tracks", "max_simultaneous_tracks"),
                  ("Matched voice-source hops", "matched_voice_source_hops"),
                  ("Median azimuth error of matches", "matched_median_azimuth_error_deg"),
              ]:
                  a, b = configs["8x8"][key], configs["8x8_sst4"][key]
                  rows.append(f"| {title} | {a} | {b} |")
              rows.extend([
                  "",
                  "> The downstream SST input cap is experimental and disabled by default.",
                  "> Diagnostics only; this does not prove seven-way speech separation."
              ])
          physics_path = Path("build-acoustix/tests/acoustix_physics.json")
          if physics_path.is_file():
              physical = json.loads(physics_path.read_text())
              impulse = physical["evidence"]["cpu_rir"]
              rows.extend([
                  "",
                  "### S1: real Acoustix CPU RIR physics check",
                  "",
                  "| Check | Measured |",
                  "| --- | ---: |",
                  f"| 1m → 2m relative propagation delay | {impulse['measured_delta_samples']} samples |",
                  f"| Expected relative delay | {impulse['expected_delta_samples']:.2f} samples |",
                  f"| Direct peak attenuation on doubling distance | {impulse['near_over_far_peak_db']:.2f} dB |",
                  f"| Expected direct peak attenuation | {impulse['expected_near_over_far_peak_db']:.2f} dB |",
                  f"| Bit-identical repeat RIR | {impulse['bit_exact_rir_repeatability']} |",
                  "",
                  "> Only a stationary first-order impulse physics test; frequency-dependent RT60 and Doppler are not validated."
              ])
          else:
              rows.extend(["", "### S1 physics", "", "No CPU RIR physics report (see test logs)."])
          signal_path = Path("build-acoustix/tests/acoustix_7x7/signal_audit.json")
          if signal_path.is_file():
              audit = json.loads(signal_path.read_text())
              rows.extend([
                  "",
                  "### PCM16 source-stem reconstruction",
                  "",
                  f"Maximum microphone reconstruction residual: **{audit['reconstruction_max_residual_lsb']} LSB** "
                  f"(quantization allowance {audit['quantization_allowance_lsb']} LSB).",
                  "",
                  f"Spatially distinct adjacent microphone pairs: **"
                  f"{sum(x > 0 for x in audit['adjacent_microphone_difference_rms_pcm16'])}/3**.",
                  "",
                  f"Trailing digital microphone silence: **"
                  f"{audit['post_acoustic_signal_silence_frames']/audit['sample_rate_hz']:.3f} s**."
              ])
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as stream:
              stream.write("\n".join(rows) + "\n")
          PY
      - name: Upload WAV, ground truth, per-source tracking report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acoustix-room-7x7-${{ inputs.duration_seconds || '12' }}s
          path: |
            build-acoustix/tests/acoustix_7x7/
            build-acoustix/tests/acoustix_physics.json
            build-acoustix/Testing/Temporary/LastTest.log
          retention-days: 10
          if-no-files-found: warn
 \
            --output-on-failure --verbose
      - name: Summarize acoustic tracking diagnostics
        if: always()
        run: |
