                  f"| 3D DOA median / P90 | {m['matched_median_3d_angular_error_deg']}° / {m['matched_p90_3d_angular_error_deg']}° |",
                  f"| Azimuth median / P90 (matched) | {m['matched_median_azimuth_error_deg']}° / {m['matched_p90_azimuth_error_deg']}° |",
